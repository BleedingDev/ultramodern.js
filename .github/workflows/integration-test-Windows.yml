name: Integration Test(Windows)

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the main branch
  push:
    branches: [main, main-ultramodern, renovate/main-rsbuild]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  integration-test-windows:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Print runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"

      - name: Git config
        shell: bash
        run: |
          git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          install: true

      - name: Check skip CI
        shell: bash
        run: echo "RESULT=$(node ./scripts/skipCI.js)" >> "$GITHUB_OUTPUT"
        id: skip-ci

      - name: Log skip CI result
        env:
          SKIP_CI_RESULT: ${{ steps.skip-ci.outputs.RESULT }}
        run: echo "$env:SKIP_CI_RESULT"

      - name: Setup Node.js 26.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Nx Cache
        id: nx-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nx-${{ github.ref_name }}-
            nx-

      - name: Install Dependencies
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: pnpm install --frozen-lockfile

      - name: Prepare
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        # The root `prepare` script is a deliberate no-op in CI
        # (scripts/prepare-root.mjs); run the build gate explicitly.
        run: pnpm run prepare-build

      - name: Install Puppeteer
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: cd ./tests/node_modules/puppeteer && npm run postinstall && cd ../..

      - name: Install Playwright Chromium
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: pnpm --dir tests/integration/rstest/basic-app-rstest-browser exec playwright install chromium

      - name: Test
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: pnpm run test:framework

      - name: Test - Adapter Rstest
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: cd ./tests && pnpm run test:rstest-adapter
