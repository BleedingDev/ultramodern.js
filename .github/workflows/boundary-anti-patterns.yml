name: Boundary Anti-Patterns

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/boundary-guards/**'
      - 'scripts/module-sdk-contracts/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - '.github/workflows/boundary-anti-patterns.yml'
  push:
    branches:
      - main
      - ultramodern
      - v4
    paths:
      - 'packages/**'
      - 'scripts/boundary-guards/**'
      - 'scripts/module-sdk-contracts/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - '.github/workflows/boundary-anti-patterns.yml'

jobs:
  boundary-anti-pattern-checks:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Pnpm
        run: corepack enable

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate module SDK contract shape
        run: pnpm run validate:module-sdk-contracts

      - name: Run boundary anti-pattern guards
        run: pnpm run validate:boundary-guards
