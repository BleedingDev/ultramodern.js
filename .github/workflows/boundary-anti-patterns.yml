name: Boundary Anti-Patterns

on:
  workflow_dispatch:
  # Trusted-base orchestration: fork PRs cannot rewrite runner selection before
  # allocation. The job remains read-only and checks out the exact fork head
  # only after an external PR has been assigned ubuntu-latest.
  pull_request_target:
    paths:
      - 'packages/**'
      - 'scripts/boundary-guards/**'
      - 'scripts/ultramodern-boundary-check/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - 'package.json'
      - 'AGENTS.md'
      - 'FORK-DIVERGENCE.md'
      - '.github/workflows/boundary-anti-patterns.yml'
  push:
    branches:
      - main
      - main-ultramodern
    paths:
      - 'packages/**'
      - 'scripts/boundary-guards/**'
      - 'scripts/ultramodern-boundary-check/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - 'package.json'
      - 'AGENTS.md'
      - 'FORK-DIVERGENCE.md'
      - '.github/workflows/boundary-anti-patterns.yml'

permissions:
  contents: read

jobs:
  boundary-anti-pattern-checks:
    # External-fork PR code receives the complete validation job on a hosted
    # runner selected by this trusted base-branch workflow.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Run boundary anti-pattern guards
        run: node scripts/boundary-guards/check-boundary-violations.js --profile scripts/boundary-guards/profile.json

      - name: Run UltraModern import boundary guard
        if: ${{ !cancelled() }}
        run: node scripts/ultramodern-boundary-check/check-fork-import-boundary.js --mode imports

      # The divergence gate derives immutable ownership at eded841256 and diffs
      # from reviewed upstream provenance 2f4d9c4559. Neither ref may be replaced
      # by a PR merge-base or push before-SHA: that would erase cumulative debt
      # or detach it from audited rename identity. Requires fetch-depth: 0 so
      # both exact commits remain reachable.
      # Only the head is event-derived: the PR branch tip on pull_request, the
      # pushed commit otherwise. Pinning it keeps the measurement deterministic
      # instead of depending on whatever the runner happens to have checked out.
      - name: Run UltraModern divergence boundary guard
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          DIVERGENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          node scripts/ultramodern-boundary-check/check-fork-import-boundary.js \
            --mode divergence --head "$DIVERGENCE_HEAD_SHA"

      - name: Enforce UltraModern divergence allowlist governance
        if: ${{ !cancelled() && (github.event_name == 'pull_request_target' || github.event_name == 'push') }}
        working-directory: ${{ github.workspace }}
        env:
          DIVERGENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            GOVERNANCE_BASE_SHA="$(git merge-base "$PR_BASE_SHA" "$DIVERGENCE_HEAD_SHA")"
          else
            GOVERNANCE_BASE_SHA="$PUSH_BEFORE_SHA"
          fi
          node scripts/ultramodern-boundary-check/check-fork-import-boundary.js \
            --mode allowlist-governance --merge-base "$GOVERNANCE_BASE_SHA" \
            --head "$DIVERGENCE_HEAD_SHA"
