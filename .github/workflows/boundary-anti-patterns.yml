name: Boundary Anti-Patterns

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/boundary-guards/**'
      - 'scripts/ultramodern-boundary-check/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - 'package.json'
      - 'AGENTS.md'
      - 'FORK-DIVERGENCE.md'
      - '.github/workflows/boundary-anti-patterns.yml'
  push:
    branches:
      - main
      - main-ultramodern
    paths:
      - 'packages/**'
      - 'scripts/boundary-guards/**'
      - 'scripts/ultramodern-boundary-check/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - 'package.json'
      - 'AGENTS.md'
      - 'FORK-DIVERGENCE.md'
      - '.github/workflows/boundary-anti-patterns.yml'

permissions:
  contents: read

jobs:
  boundary-anti-pattern-checks:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    # Never run untrusted fork-PR code on (potentially) self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Run boundary anti-pattern guards
        run: node scripts/boundary-guards/check-boundary-violations.js --profile scripts/boundary-guards/profile.json

      - name: Run UltraModern import boundary guard
        if: ${{ !cancelled() }}
        run: node scripts/ultramodern-boundary-check/check-fork-import-boundary.js --mode imports

      # The divergence budgets in divergence-allowlist.json are recorded against
      # the checker's built-in upstream base (divergence.js
          # DEFAULT_DIVERGENCE_BASE_REF = 3748f08860), so the guard must always be
      # measured against that base — never a PR merge-base or a push
      # before-SHA. Against a PR-sized base the gate is wrong in both
      # directions: fork-added files already exist there, which breaks the
      # `--diff-filter=MD` "fork-new files are excluded" assumption and
      # false-fails legitimate Bucket-A work as unallowlisted-divergence, while
      # a PR-sized delta inside an allowlisted upstream file is always below its
      # base-sized budget and can never trip line-/hunk-budget-exceeded.
          # Requires the checkout's fetch-depth: 0 so 3748f08860 stays reachable.
      # Only the head is event-derived: the PR branch tip on pull_request, the
      # pushed commit otherwise. Pinning it keeps the measurement deterministic
      # instead of depending on whatever the runner happens to have checked out.
      - name: Run UltraModern divergence boundary guard
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          DIVERGENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          node scripts/ultramodern-boundary-check/check-fork-import-boundary.js \
            --mode divergence --head "$DIVERGENCE_HEAD_SHA"

      - name: Enforce UltraModern divergence allowlist governance
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          DIVERGENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          MERGE_BASE="$(git merge-base "origin/$GITHUB_BASE_REF" "$DIVERGENCE_HEAD_SHA")"
          node scripts/ultramodern-boundary-check/check-fork-import-boundary.js \
            --mode allowlist-governance --merge-base "$MERGE_BASE" \
            --head "$DIVERGENCE_HEAD_SHA"
