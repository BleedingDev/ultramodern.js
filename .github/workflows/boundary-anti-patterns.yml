name: Boundary Anti-Patterns

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/boundary-guards/**'
      - 'scripts/ultramodern-boundary-check/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - 'package.json'
      - '.github/workflows/boundary-anti-patterns.yml'
  push:
    branches:
      - main
      - main-ultramodern
    paths:
      - 'packages/**'
      - 'scripts/boundary-guards/**'
      - 'scripts/ultramodern-boundary-check/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - 'package.json'
      - '.github/workflows/boundary-anti-patterns.yml'

permissions:
  contents: read

jobs:
  boundary-anti-pattern-checks:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    # Never run untrusted fork-PR code on (potentially) self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Run boundary anti-pattern guards
        run: node scripts/boundary-guards/check-boundary-violations.js --profile scripts/boundary-guards/profile.json

      - name: Run UltraModern divergence boundary guard
        if: ${{ !cancelled() }}
        run: node scripts/ultramodern-boundary-check/check-fork-import-boundary.js
