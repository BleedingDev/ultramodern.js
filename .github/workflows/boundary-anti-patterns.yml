name: Boundary Anti-Patterns

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/boundary-guards/**'
      - 'scripts/module-sdk-contracts/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - '.github/workflows/boundary-anti-patterns.yml'
  push:
    branches:
      - main
      - main-ultramodern
    paths:
      - 'packages/**'
      - 'scripts/boundary-guards/**'
      - 'scripts/module-sdk-contracts/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - '.github/workflows/boundary-anti-patterns.yml'

permissions:
  contents: read

jobs:
  boundary-anti-pattern-checks:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    # Never run untrusted fork-PR code on (potentially) self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      # The validators are dependency-free (Node builtins only, see
      # scripts/lib/README.md), so no install step is needed. Keep these
      # invocations in sync with the validate:* scripts in package.json.
      - name: Validate module SDK contract shape
        run: node scripts/module-sdk-contracts/validate-module-sdk-contracts.js --contract docs/super-app-rfc-adr/contracts/module-sdk-contracts.json --skip-manifest-validation

      - name: Run boundary anti-pattern guards
        run: node scripts/boundary-guards/check-boundary-violations.js --profile scripts/boundary-guards/profile.json
