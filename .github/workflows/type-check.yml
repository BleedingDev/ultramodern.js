name: Type Check

on:
  pull_request:
    branches: [main, main-ultramodern]

  merge_group:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    # Never run untrusted fork-PR code on (potentially) self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Print runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0

      - name: Check skip CI
        run: echo "RESULT=$(node ./scripts/skipCI.js)" >> "$GITHUB_OUTPUT"
        id: skip-ci

      - name: Log skip CI result
        env:
          SKIP_CI_RESULT: ${{ steps.skip-ci.outputs.RESULT }}
        run: echo "$SKIP_CI_RESULT"

      - name: Nx Cache
        id: nx-cache
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-${{ github.base_ref }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nx-${{ github.base_ref }}-${{ github.ref_name }}-
            nx-${{ github.base_ref }}-
            nx-

      - name: Install Dependencies
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Type Check
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        # The root `prepare` script is a deliberate no-op in CI
        # (scripts/prepare-root.mjs); run the build gate explicitly.
        run: mise exec -- pnpm run prepare-build

      - name: Validate critical packages with tsgo
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: mise exec -- pnpm run validate:tsgo
