name: Type Check

concurrency:
  group: type-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, main-ultramodern]

  merge_group:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    # Never run untrusted fork-PR code on (potentially) self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Print runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.10.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache_save: false

      - name: Install Dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Type Check
        run: mise exec -- pnpm run prepare-build

      - name: Build cross-project type-check dependency
        run: mise exec -- pnpm --dir tests/integration/bff-cross-project/bff-api-app build

      - name: Validate critical packages with tsgo
        run: mise exec -- pnpm run validate:tsgo
