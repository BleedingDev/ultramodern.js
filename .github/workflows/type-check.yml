name: Type Check

concurrency:
  group: type-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, main-ultramodern]

  merge_group:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    # Never run untrusted fork-PR code on (potentially) self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Print runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Check skip CI
        run: echo "RESULT=$(node ./scripts/skipCI.js)" >> "$GITHUB_OUTPUT"
        id: skip-ci

      - name: Log skip CI result
        env:
          SKIP_CI_RESULT: ${{ steps.skip-ci.outputs.RESULT }}
        run: echo "$SKIP_CI_RESULT"

      - name: Nx Cache
        id: nx-cache
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ github.base_ref }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nx-${{ github.base_ref }}-${{ github.ref_name }}-
            nx-${{ github.base_ref }}-
            nx-

      - name: Install Dependencies
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Type Check
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        # The root `prepare` script is a deliberate no-op in CI
        # (scripts/prepare-root.mjs); run the build gate explicitly.
        run: mise exec -- pnpm run prepare-build

      - name: Validate critical packages with tsgo
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: mise exec -- pnpm run validate:tsgo
