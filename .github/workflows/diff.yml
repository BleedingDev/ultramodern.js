name: Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - main-ultramodern

# Default to read-only; the Build job elevates only what rsdoctor needs.
permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          install: true

      - name: Setup Node.js 26.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install Dependencies and Build
        run: |
          pnpm install
          pnpm run build:required

      - name: Build Demo Project
        run: |
          cd benchmark/bundle-diff
          RSDOCTOR=1 pnpm run build

      - name: Report Compressed Size
        uses: web-infra-dev/rsdoctor-action@8fd3b03827afc9de3acf17810be26bb87b6ca6b5 # main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          file_path: 'benchmark/bundle-diff/dist/rsdoctor-data.json'
          target_branch: 'main-ultramodern'
