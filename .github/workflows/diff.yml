name: Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - main-ultramodern

# Default to read-only; the Build job elevates only what rsdoctor needs.
permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'
          cache: 'pnpm'

      - name: Install Dependencies and Build
        run: |
          pnpm install
          pnpm run build:required

      - name: Build Demo Project
        run: |
          cd benchmark/bundle-diff
          RSDOCTOR=1 pnpm run build

      - name: Report Compressed Size
        uses: web-infra-dev/rsdoctor-action@8fd3b03827afc9de3acf17810be26bb87b6ca6b5 # main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          file_path: 'benchmark/bundle-diff/dist/rsdoctor-data.json'
          target_branch: 'main-ultramodern'
