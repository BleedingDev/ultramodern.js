name: UltraModern Production Readiness

on:
  workflow_run:
    workflows:
      - Publish BleedingDev Packages
    types:
      - completed
    branches:
      - main-ultramodern
  schedule:
    - cron: '47 3 * * 1-5'
  workflow_dispatch:
    inputs:
      create_package:
        description: 'Exact published create package, for example @bleedingdev/modern-js-create@3.5.0-ultramodern.45'
        required: true
      scale_profile:
        description: 'Generated SuperApp portfolio scale profile'
        required: true
        default: 'erp-10'
        type: choice
        options:
          - 'erp-10'
          - 'erp-25'
          - 'erp-50'
      deploy_cloudflare:
        description: 'Deploy the generated workspace to Cloudflare and run public proof'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      workers_dev_subdomain:
        description: 'workers.dev subdomain used for generated public proof'
        required: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  BLEEDINGDEV_RELEASE_IDENTITY_ARTIFACT: bleedingdev-release-identity
  BLEEDINGDEV_RELEASE_IDENTITY_DIR: .modern/triggering-release-identity
  BLEEDINGDEV_PUBLISH_OUTCOME_ARTIFACT: bleedingdev-publish-outcome
  BLEEDINGDEV_PUBLISH_OUTCOME_DIR: .modern/triggering-publish-outcome
  BLEEDINGDEV_PUBLISH_OUTCOME: .modern/triggering-publish-outcome/publish-outcome.json
  BLEEDINGDEV_PUBLISH_OUTCOME_ARTIFACTS: .modern/triggering-publish-outcome/artifact-pages.json
  BLEEDINGDEV_POSTPUBLISH_ACCEPTANCE_RECEIPT: .modern/production-readiness/postpublish-acceptance-receipt.json

concurrency:
  group: ultramodern-production-readiness-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve-release-identity:
    name: Resolve the triggering publication identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == github.repository_owner &&
      github.event.workflow_run.triggering_actor.login == github.repository_owner
    outputs:
      publication_signal: ${{ steps.publication-signal.outputs.exists }}
      authorized: ${{ steps.release-identity.outputs.authorized }}
      dry_run: ${{ steps.publish-outcome.outputs.dry_run }}
      manifest_sha256: ${{ steps.release-identity.outputs.manifest_sha256 }}
      publication_artifact_name: ${{ steps.release-identity.outputs.publication_artifact_name }}
      producer_artifact_identity: ${{ steps.release-identity.outputs.producer_artifact_identity }}
      run_identity: ${{ steps.release-identity.outputs.run_identity }}
      version: ${{ steps.release-identity.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout trusted receipt verifier
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: List triggering run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID/artifacts?per_page=100" \
            > "$BLEEDINGDEV_PUBLISH_OUTCOME_ARTIFACTS"

          node <<'NODE'
          const fs = require('node:fs');
          const pages = JSON.parse(
            fs.readFileSync(process.env.BLEEDINGDEV_PUBLISH_OUTCOME_ARTIFACTS, 'utf8'),
          );
          if (!Array.isArray(pages) || pages.some(page => !Array.isArray(page?.artifacts))) {
            throw new Error('Artifact API response must be a paginated artifact listing');
          }
          NODE

      - name: Select the triggering publish outcome
        id: publish-outcome-artifact
        env:
          TRIGGER_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          node scripts/ultramodern-publish/publish-outcome.mjs select-artifact \
            --artifacts "$BLEEDINGDEV_PUBLISH_OUTCOME_ARTIFACTS" \
            --run-id "$TRIGGER_RUN_ID" \
            --run-attempt "$TRIGGER_RUN_ATTEMPT" \
            --completed-at "$TRIGGER_COMPLETED_AT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download triggering publish outcome
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v7.0.0
        with:
          name: ${{ steps.publish-outcome-artifact.outputs.artifact_name }}
          path: .modern/triggering-publish-outcome
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify triggering publish outcome
        id: publish-outcome
        env:
          OUTCOME_ARTIFACT_NAME: ${{ steps.publish-outcome-artifact.outputs.artifact_name }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          tractor_evidence=()
          if [[ -f "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR/tractor-downstream-acceptance.json" ]]; then
            tractor_evidence=(
              --tractor-report "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR/tractor-downstream-acceptance.json"
            )
          fi
          node scripts/ultramodern-publish/publish-outcome.mjs verify \
            --outcome "$BLEEDINGDEV_PUBLISH_OUTCOME" \
            --artifact-name "$OUTCOME_ARTIFACT_NAME" \
            --manifest "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR/manifest.json" \
            --manifest-digest "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR/manifest.json.sha256" \
            --cohort-digest "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR/cohort.sha256" \
            --receipt "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR/acceptance-receipt.json" \
            --operational-evidence "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR/acceptance-receipt.operational-independence.json" \
            --published-receipt "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR/published-acceptance-receipt.json" \
            --published-operational-evidence "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR/published-acceptance-receipt.operational-independence.json" \
            "${tractor_evidence[@]}" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$TRIGGER_HEAD_SHA" \
            --run-id "$TRIGGER_RUN_ID" \
            --run-attempt "$TRIGGER_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Find authenticated publication identity
        id: publication-signal
        env:
          AUTHENTICATED_DRY_RUN: ${{ steps.publish-outcome.outputs.dry_run }}
          AUTHENTICATED_PRODUCER_ARTIFACT_IDENTITY: ${{ steps.publish-outcome.outputs.producer_artifact_identity }}
          AUTHENTICATED_PUBLICATION_RUN_ATTEMPT: ${{ steps.publish-outcome.outputs.publication_run_attempt }}
        run: |
          if [[ "$AUTHENTICATED_DRY_RUN" == "true" ]]; then
            exit 0
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const pages = JSON.parse(
            fs.readFileSync(process.env.BLEEDINGDEV_PUBLISH_OUTCOME_ARTIFACTS, 'utf8'),
          );
          if (!Array.isArray(pages) || pages.some(page => !Array.isArray(page?.artifacts))) {
            throw new Error('Artifact API response must be a paginated artifact listing');
          }
          const identityArtifact = 'bleedingdev-release-identity';
          if (process.env.BLEEDINGDEV_RELEASE_IDENTITY_ARTIFACT !== identityArtifact) {
            throw new Error('Publication identity artifact name drift');
          }
          const producer = process.env.AUTHENTICATED_PRODUCER_ARTIFACT_IDENTITY;
          const publicationAttempt =
            process.env.AUTHENTICATED_PUBLICATION_RUN_ATTEMPT;
          if (
            !/^run-[1-9]\d*-attempt-[1-9]\d*$/u.test(producer) ||
            !/^[1-9]\d*$/u.test(publicationAttempt)
          ) {
            throw new Error(
              'Authenticated outcome is missing a valid publication identity',
            );
          }
          const expectedName =
            `${identityArtifact}-${producer}-publication-attempt-${publicationAttempt}`;
          const matches = pages
            .flatMap(page => page.artifacts)
            .filter(artifact => artifact?.name === expectedName);
          if (matches.length !== 1 || matches[0].expired !== false) {
            throw new Error(
              `Expected exactly one live publication identity artifact named ${expectedName}`,
            );
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `exists=true\nartifact_name=${expectedName}\n`,
          );
          NODE

      - name: Download triggering release identity
        if: steps.publish-outcome.outputs.dry_run == 'false'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v7.0.0
        with:
          name: ${{ steps.publication-signal.outputs.artifact_name }}
          path: .modern/triggering-release-identity
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify triggering release acceptance receipt
        if: steps.publication-signal.outputs.exists == 'true'
        run: |
          if [[ "${{ steps.publish-outcome.outputs.dry_run }}" == "true" ]]; then
            exit 0
          fi

          node - "${{ steps.publish-outcome.outputs.producer_run_identity }}" <<'NODE'
          const fs = require('node:fs');
          const identity = JSON.parse(
            fs.readFileSync(
              process.env.BLEEDINGDEV_RELEASE_IDENTITY_DIR + '/release-identity.json',
              'utf8',
            ),
          );
          if (identity.producerRunIdentity !== process.argv[2]) {
            throw new Error('Publication identity producer does not match the authenticated outcome');
          }
          NODE

          node scripts/ultramodern-production-readiness/published-create-proof/acceptance-receipt.mjs \
            --verify \
            --manifest "$BLEEDINGDEV_RELEASE_IDENTITY_DIR/manifest.json" \
            --receipt "$BLEEDINGDEV_RELEASE_IDENTITY_DIR/acceptance-receipt.json" \
            --run-identity "${{ steps.publish-outcome.outputs.producer_run_identity }}"

          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --expected-mode published \
            --manifest "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR/manifest.json" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_PUBLISH_OUTCOME_DIR/published-acceptance-receipt.json" \
            --run-identity "${{ steps.publish-outcome.outputs.producer_run_identity }}"

      - name: Verify triggering release identity
        id: release-identity
        if: steps.publication-signal.outputs.exists == 'true'
        env:
          AUTHENTICATED_DRY_RUN: ${{ steps.publish-outcome.outputs.dry_run }}
          AUTHENTICATED_MANIFEST_SHA256: ${{ steps.publish-outcome.outputs.manifest_sha256 }}
          AUTHENTICATED_PUBLICATION_RUN_ATTEMPT: ${{ steps.publish-outcome.outputs.publication_run_attempt }}
          AUTHENTICATED_PRODUCER_ARTIFACT_IDENTITY: ${{ steps.publish-outcome.outputs.producer_artifact_identity }}
          AUTHENTICATED_PRODUCER_RUN_IDENTITY: ${{ steps.publish-outcome.outputs.producer_run_identity }}
          AUTHENTICATED_VERSION: ${{ steps.publish-outcome.outputs.version }}
          TRIGGER_ARTIFACT_NAME: ${{ steps.publication-signal.outputs.artifact_name }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ "$AUTHENTICATED_DRY_RUN" == "true" ]]; then
            exit 0
          fi

          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.env.BLEEDINGDEV_RELEASE_IDENTITY_DIR;
          const readJson = file => JSON.parse(fs.readFileSync(path.join(root, file), 'utf8'));
          const sha256 = file => crypto.createHash('sha256').update(fs.readFileSync(path.join(root, file))).digest('hex');
          const hasExactKeys = (value, expected) =>
            value !== null &&
            typeof value === 'object' &&
            !Array.isArray(value) &&
            JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...expected].sort());
          const identity = readJson('release-identity.json');
          const manifest = readJson('manifest.json');
          const receipt = readJson('acceptance-receipt.json');
          const manifestSha256 = sha256('manifest.json');
          const receiptSha256 = sha256('acceptance-receipt.json');
          const detachedManifestSha256 = fs.readFileSync(
            path.join(root, 'manifest.json.sha256'),
            'utf8',
          );
          const detachedCohortSha256 = fs.readFileSync(
            path.join(root, 'cohort.sha256'),
            'utf8',
          );
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
          if (
            !hasExactKeys(identity, [
              'acceptanceReceiptSha256',
              'cohortDigest',
              'dryRun',
              'manifestSha256',
              'producerRunAttempt',
              'producerRunIdentity',
              'producerArtifactIdentity',
              'publicationRunAttempt',
              'release',
              'releaseRunId',
              'schema',
              'schemaVersion',
              'source',
            ]) ||
            identity.schema !== 'bleedingdev.ultramodern.published-release-identity' ||
            identity.schemaVersion !== 2 ||
            !hasExactKeys(identity.source, ['commit', 'repository']) ||
            !hasExactKeys(identity.release, ['tag', 'version']) ||
            String(identity.releaseRunId) !== process.env.TRIGGER_RUN_ID ||
            !/^[1-9]\d*$/u.test(String(identity.producerRunAttempt)) ||
            !/^[1-9]\d*$/u.test(String(identity.publicationRunAttempt)) ||
            String(identity.publicationRunAttempt) !== process.env.AUTHENTICATED_PUBLICATION_RUN_ATTEMPT ||
            Number(identity.producerRunAttempt) > Number(process.env.AUTHENTICATED_PUBLICATION_RUN_ATTEMPT) ||
            identity.producerRunIdentity !== `github:${manifest.source.repository}:run:${process.env.TRIGGER_RUN_ID}:attempt:${identity.producerRunAttempt}` ||
            identity.producerArtifactIdentity !== `run-${process.env.TRIGGER_RUN_ID}-attempt-${identity.producerRunAttempt}` ||
            identity.producerRunIdentity !== process.env.AUTHENTICATED_PRODUCER_RUN_IDENTITY ||
            identity.producerArtifactIdentity !== process.env.AUTHENTICATED_PRODUCER_ARTIFACT_IDENTITY ||
            process.env.TRIGGER_ARTIFACT_NAME !== `${process.env.BLEEDINGDEV_RELEASE_IDENTITY_ARTIFACT}-${identity.producerArtifactIdentity}-publication-attempt-${identity.publicationRunAttempt}` ||
            identity.source.commit !== process.env.TRIGGER_HEAD_SHA ||
            identity.source.repository !== process.env.GITHUB_REPOSITORY ||
            identity.dryRun !== false ||
            identity.manifestSha256 !== manifestSha256 ||
            identity.manifestSha256 !== process.env.AUTHENTICATED_MANIFEST_SHA256 ||
            identity.release.version !== process.env.AUTHENTICATED_VERSION ||
            identity.acceptanceReceiptSha256 !== receiptSha256
          ) {
            throw new Error('Publication identity does not match the triggering workflow run');
          }
          if (
            !hasExactKeys(manifest, [
              'aliases',
              'cohortDigest',
              'cohortProjection',
              'dependencyGraph',
              'packages',
              'publishOrder',
              'release',
              'schema',
              'schemaVersion',
              'source',
              'tools',
            ]) ||
            manifest.schema !== 'bleedingdev.ultramodern.release-manifest' ||
            manifest.schemaVersion !== 2 ||
            !hasExactKeys(manifest.source, ['commit', 'repository']) ||
            !hasExactKeys(manifest.release, ['tag', 'version']) ||
            !hasExactKeys(manifest.tools, ['node', 'npm', 'pnpm']) ||
            !Array.isArray(manifest.packages) ||
            manifest.packages.length === 0 ||
            !Array.isArray(manifest.publishOrder) ||
            !semver.test(manifest.release.version) ||
            manifest.release.version !== identity.release.version ||
            manifest.release.tag !== identity.release.tag ||
            manifest.source.commit !== identity.source.commit ||
            manifest.source.repository !== identity.source.repository ||
            manifest.cohortDigest !== identity.cohortDigest ||
            detachedManifestSha256 !== `${manifestSha256}  manifest.json\n` ||
            detachedCohortSha256 !== `${manifest.cohortDigest}\n`
          ) {
            throw new Error('Release manifest does not match the publication identity');
          }
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, 'authorized=true\n');
          fs.appendFileSync(output, `manifest_sha256=${identity.manifestSha256}\n`);
          fs.appendFileSync(output, `publication_artifact_name=${process.env.TRIGGER_ARTIFACT_NAME}\n`);
          fs.appendFileSync(output, `run_identity=${identity.producerRunIdentity}\n`);
          fs.appendFileSync(output, `producer_artifact_identity=${identity.producerArtifactIdentity}\n`);
          fs.appendFileSync(output, `version=${manifest.release.version}\n`);
          NODE

  published-create-superapp:
    name: Triggering release passes post-publish ERP-10 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - resolve-release-identity
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.resolve-release-identity.outputs.publication_signal == 'true' &&
      needs.resolve-release-identity.outputs.dry_run == 'false' &&
      needs.resolve-release-identity.outputs.authorized == 'true'
    env:
      RELEASE_MANIFEST_SHA256: ${{ needs.resolve-release-identity.outputs.manifest_sha256 }}
      RELEASE_VERSION: ${{ needs.resolve-release-identity.outputs.version }}
      TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGER_RUN_IDENTITY: ${{ needs.resolve-release-identity.outputs.run_identity }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout triggering release commit
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ env.TRIGGER_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.x

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0

      - name: Download triggering release identity
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v7.0.0
        with:
          name: ${{ needs.resolve-release-identity.outputs.publication_artifact_name }}
          path: .modern/triggering-release-identity
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Bind downloaded manifest to publication identity
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const manifestPath = path.join(
            process.env.BLEEDINGDEV_RELEASE_IDENTITY_DIR,
            'manifest.json',
          );
          const actual = crypto
            .createHash('sha256')
            .update(fs.readFileSync(manifestPath))
            .digest('hex');
          if (actual !== process.env.RELEASE_MANIFEST_SHA256) {
            throw new Error('Downloaded manifest does not match the publication identity');
          }
          NODE

      - name: Install browser smoke runtime
        run: npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Run post-publish ERP-10 acceptance
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --mode published \
            --manifest "$BLEEDINGDEV_RELEASE_IDENTITY_DIR/manifest.json" \
            --expected-source-revision "$TRIGGER_HEAD_SHA" \
            --expected-version "$RELEASE_VERSION" \
            --run-identity "$TRIGGER_RUN_IDENTITY" \
            --scale-profile erp-10 \
            --registry-url https://registry.npmjs.org/ \
            --receipt "$BLEEDINGDEV_POSTPUBLISH_ACCEPTANCE_RECEIPT"

      - name: Upload production-readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ultramodern-production-readiness-release-${{ github.event.workflow_run.id }}
          path: .modern/production-readiness/
          if-no-files-found: warn
          include-hidden-files: true

  manual-published-create-superapp:
    name: Explicit create package proves a generated SuperApp
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      CREATE_PACKAGE_INPUT: ${{ github.event_name == 'schedule' && vars.ULTRAMODERN_PRODUCTION_READINESS_CREATE_PACKAGE || inputs.create_package }}
      SCALE_PROFILE_INPUT: ${{ inputs.scale_profile }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.x

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0

      - name: Validate exact create package input
        run: |
          node <<'NODE'
          const exactCreate = /^@bleedingdev\/modern-js-create@(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
          if (!exactCreate.test(process.env.CREATE_PACKAGE_INPUT || '')) {
            throw new Error('create_package must be an explicit @bleedingdev/modern-js-create@<exact-semver> specifier');
          }
          NODE

      - name: Install browser smoke runtime
        run: npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Prove explicit published UltraModern SuperApp scaffold
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            SCALE_PROFILE="${SCALE_PROFILE_INPUT:-erp-25}"
          else
            SCALE_PROFILE="${SCALE_PROFILE_INPUT:-erp-10}"
          fi
          node scripts/ultramodern-production-readiness/run-published-create-proof.mjs \
            --create-package "$CREATE_PACKAGE_INPUT" \
            --project-name ultramodern-ci-superapp \
            --scale-profile "$SCALE_PROFILE" \
            --out .modern/production-readiness/published-create-proof.json

      - name: Upload manual production-readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ultramodern-production-readiness-manual-${{ github.run_id }}
          path: .modern/production-readiness/
          if-no-files-found: warn
          include-hidden-files: true

  cloudflare-generated-deploy:
    name: Generated SuperApp Cloudflare deploy proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare == 'true'
    environment: cloudflare-production-readiness
    env:
      CREATE_PACKAGE_INPUT: ${{ inputs.create_package }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.x

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0

      - name: Validate exact create package input
        run: |
          node <<'NODE'
          const exactCreate = /^@bleedingdev\/modern-js-create@(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
          if (!exactCreate.test(process.env.CREATE_PACKAGE_INPUT || '')) {
            throw new Error('create_package must be an explicit @bleedingdev/modern-js-create@<exact-semver> specifier');
          }
          NODE

      - name: Install browser smoke runtime
        run: npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Deploy generated UltraModern SuperApp to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ULTRAMODERN_CLOUDFLARE_WORKERS_DEV_SUBDOMAIN: ${{ inputs.workers_dev_subdomain }}
          SCALE_PROFILE_INPUT: ${{ inputs.scale_profile }}
        run: |
          node scripts/ultramodern-production-readiness/run-published-create-proof.mjs \
            --create-package "$CREATE_PACKAGE_INPUT" \
            --project-name ultramodern-ci-superapp \
            --scale-profile "$SCALE_PROFILE_INPUT" \
            --out .modern/production-readiness/cloudflare-deploy-proof.json \
            --deploy-cloudflare

      - name: Upload Cloudflare deploy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ultramodern-cloudflare-production-readiness-${{ github.run_id }}
          path: .modern/production-readiness/
          if-no-files-found: warn
          include-hidden-files: true
