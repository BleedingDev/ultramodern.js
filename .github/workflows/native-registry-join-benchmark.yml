name: Native registry join benchmark
on:
  push:
    branches: [ci/native-parallel-steps-20261007]
permissions:
  contents: read
jobs:
  matched:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9bc0147b1412ebf7f65169221d573ba8cc1095e5
          persist-credentials: false
      - name: Prepare read-only registry fixture
        run: |
          mkdir -p "$RUNNER_TEMP/registry-fixture-bin"
          printf '#!/usr/bin/env bash\nsleep 3\nexit 0\n' > "$RUNNER_TEMP/registry-fixture-bin/node"
          chmod +x "$RUNNER_TEMP/registry-fixture-bin/node"
          printf 'pair\tmode\twall_ns\n' > "$RUNNER_TEMP/registry-join.tsv"
          printf 'source=%s runner=%s image=%s\n' "$(git rev-parse HEAD)" "$(uname -a)" "$ImageVersion"
      - name: Start p1-shell
        id: p1-shell
        run: echo "ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"
      - name: Registry p1-shell
        run: |
          (
            status=0
            PATH="$RUNNER_TEMP/registry-fixture-bin:$PATH" bash scripts/ultramodern-publish/wait-for-registry-cohort.sh "$RUNNER_TEMP" 1 fixture fixture || status=$?
            printf '%s\n' "$status" > "$RUNNER_TEMP/registry-cohort-wait.status"
            exit "$status"
          ) > "$RUNNER_TEMP/registry-cohort-wait.log" 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/registry-cohort-wait.pid"
      - name: Independent install fixture p1-shell
        run: sleep 1
      - name: Join p1-shell
        run: |
          pid="$(cat "$RUNNER_TEMP/registry-cohort-wait.pid")"
          while kill -0 "$pid" 2>/dev/null; do sleep 5; done
          cat "$RUNNER_TEMP/registry-cohort-wait.log"
          exit "$(cat "$RUNNER_TEMP/registry-cohort-wait.status")"
      - name: Measure p1-shell
        run: |
          elapsed=$(( $(date +%s%N) - ${{ steps.p1-shell.outputs.ns }} ))
          printf '1\tshell\t%s\n' "$elapsed" >> "$RUNNER_TEMP/registry-join.tsv"
      - name: Start p1-native
        id: p1-native
        run: echo "ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"
      - name: Registry p1-native
        id: registry-p1-native
        background: true
        run: PATH="$RUNNER_TEMP/registry-fixture-bin:$PATH" bash scripts/ultramodern-publish/wait-for-registry-cohort.sh "$RUNNER_TEMP" 1 fixture fixture
      - name: Independent install fixture p1-native
        run: sleep 1
      - name: Join p1-native
        wait: registry-p1-native
      - name: Measure p1-native
        run: |
          elapsed=$(( $(date +%s%N) - ${{ steps.p1-native.outputs.ns }} ))
          printf '1\tnative\t%s\n' "$elapsed" >> "$RUNNER_TEMP/registry-join.tsv"
