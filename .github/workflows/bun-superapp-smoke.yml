name: Bun Super-App Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/boundary-guards/**'
      - 'scripts/release-gates/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - 'docs/super-app-rfc-adr/evidence/module-certification/**'
      - 'docs/super-app-rfc-adr/evidence/release-candidate/**'
      - 'package.json'
      - '.github/workflows/bun-superapp-smoke.yml'
  push:
    branches:
      - main
      - main-ultramodern
    paths:
      - 'scripts/boundary-guards/**'
      - 'scripts/release-gates/**'
      - 'docs/super-app-rfc-adr/contracts/**'
      - 'docs/super-app-rfc-adr/evidence/module-certification/**'
      - 'docs/super-app-rfc-adr/evidence/release-candidate/**'
      - 'package.json'
      - '.github/workflows/bun-superapp-smoke.yml'

permissions:
  contents: read

jobs:
  # Advisory on fork PRs: do not execute untrusted code on potentially
  # self-hosted runners; emit an explicit successful skip notice instead.
  bun-superapp-smoke-fork-pr-notice:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 5
    steps:
      - name: Emit fork PR advisory skip notice
        run: |
          echo "::notice::skipped: fork PR, self-hosted runner policy"

  bun-superapp-smoke:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    # Never run untrusted fork-PR code on (potentially) self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      # validate:bun-smoke is a dependency-free Bun compatibility pass through
      # one release-gates profile; the Node matrix owns gate correctness.
      - name: Bun Smoke Validation
        run: bun run validate:bun-smoke
