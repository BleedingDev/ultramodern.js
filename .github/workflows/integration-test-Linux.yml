name: Integration Test(Linux)

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the main branch
  push:
    branches: [main, main-ultramodern, renovate/main-rsbuild]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.changeset/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  integration-test-linux:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    # The GitHub-hosted public runner has 4 vCPU / 16 GB. A healthy run is ~15 min;
    # this ceiling turns a hung fixture into a clean failure instead of letting
    # the job sit on the GitHub default of 6 hours.
    timeout-minutes: 60

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Print runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check skip CI
        run: echo "RESULT=$(node ./scripts/skipCI.js)" >> "$GITHUB_OUTPUT"
        id: skip-ci

      - name: Log skip CI result
        env:
          SKIP_CI_RESULT: ${{ steps.skip-ci.outputs.RESULT }}
        run: echo "$SKIP_CI_RESULT"

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Nx Cache
        id: nx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nx-${{ github.ref_name }}-
            nx-

      - name: Install Dependencies
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Prepare
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        # The root `prepare` script is a deliberate no-op in CI
        # (scripts/prepare-root.mjs); run the build gate explicitly.
        run: mise exec -- pnpm run prepare-build

      # scripts/lib/browser-provisioning.js is the one browser provisioner: it
      # reads the playwright the frozen install resolved for these runtimes,
      # and that version keys the browser cache.
      - name: Resolve Playwright runtime
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        id: browser-runtime
        run: node scripts/lib/browser-provisioning.js --resolve --runtime tests --runtime tests/integration/rstest/basic-app-rstest-browser

      - name: Restore Playwright browser cache
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Install Playwright browsers
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: >-
          node scripts/lib/browser-provisioning.js --install --runtime tests --runtime tests/integration/rstest/basic-app-rstest-browser
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Test
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: mise exec -- pnpm run test:framework

      - name: Test - Adapter Rstest
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: cd ./tests && mise exec -- pnpm run test:rstest-adapter

      - name: Test - Published package surfaces
        if: ${{steps.skip-ci.outputs.RESULT != 'true'}}
        run: cd ./tests && mise exec -- pnpm run test:utils
