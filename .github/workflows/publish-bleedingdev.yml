name: Publish BleedingDev Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, for example 3.8.3-ultramodern.1"
        required: true
      dry_run:
        description: "Validate the exact release without authorizing publication"
        required: true
        type: boolean
        default: false
      recovery_run_id:
        description: "Prior same-repository run containing an accepted immutable bundle"
        required: false
        type: string
        default: ""
      recovery_run_attempt:
        description: "Producer attempt for the prior accepted immutable bundle"
        required: false
        type: string
        default: ""

# id-token: write is granted only to the two registry publish jobs. Publication
# is OIDC-only; all other jobs are read-only.
permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  BLEEDINGDEV_PUBLISH_CONCURRENCY: "8"
  # The cohort ships `latest` and nothing else. Trusted-publishing OIDC cannot
  # mutate dist-tags (see the accept-published comment below), so the dispatch
  # contract below pins the tag at publish time. The stale `ultramodern-canary`
  # tag was retired on 2026-08-05 rather than kept alive by hand.
  BLEEDINGDEV_PUBLISH_TAG: latest
  BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT: bleedingdev-release-bundle
  BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT: bleedingdev-release-acceptance
  BLEEDINGDEV_PUBLISHED_ACCEPTANCE_ARTIFACT: bleedingdev-published-acceptance
  BLEEDINGDEV_RELEASE_IDENTITY_ARTIFACT: bleedingdev-release-identity
  BLEEDINGDEV_PUBLISH_OUTCOME_ARTIFACT: bleedingdev-publish-outcome
  BLEEDINGDEV_RELEASE_DIR: .modern/bleedingdev-publish
  BLEEDINGDEV_RELEASE_MANIFEST: .modern/bleedingdev-publish/manifest.json
  BLEEDINGDEV_RELEASE_MANIFEST_DIGEST: .modern/bleedingdev-publish/manifest.json.sha256
  BLEEDINGDEV_RELEASE_COHORT_DIGEST: .modern/bleedingdev-publish/cohort.sha256
  BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT: .modern/bleedingdev-publish/acceptance-receipt.json
  BLEEDINGDEV_PUBLISHED_ACCEPTANCE_RECEIPT: .modern/bleedingdev-publish/published-acceptance-receipt.json
  BLEEDINGDEV_RELEASE_IDENTITY: .modern/bleedingdev-publish/release-identity.json
  BLEEDINGDEV_PUBLISH_OUTCOME: .modern/bleedingdev-publish/publish-outcome.json

# Every version and dry run shares this lock. A newer dispatch queues behind an
# active release instead of cancelling or racing it.
concurrency:
  group: publish-bleedingdev
  cancel-in-progress: false

jobs:
  publish-security:
    name: Validate publish security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      # Consumer: prepare-release passes this exact version to rewrite.mjs.
      - name: Validate publish inputs
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery_run_attempt }}
        run: |
          [[ "$PUBLISH_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-ultramodern\.[1-9][0-9]*$ ]]
          if [[ -n "$RECOVERY_RUN_ID" || -n "$RECOVERY_RUN_ATTEMPT" ]]; then
            [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$RECOVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          fi

  # Source qualification gates publication but produces nothing the release
  # bundle consumes, so it runs beside prepare-release instead of ahead of it.
  # validate-release and publish both need it, so nothing reaches the registry
  # on an unqualified source.
  qualify-source:
    name: Qualify the release source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        # Full history: "Qualify release source" runs pnpm test:scripts, whose
        # divergence gate derives ownership at eded841256 and diffs from the
        # reviewed upstream provenance 2f4d9c4559. Those commits are unreachable
        # in a shallow clone, so a depth-1 checkout fails release qualification.
        # Matches ultramodern-nightly.yml and
        # boundary-anti-patterns.yml, which check out at fetch-depth: 0 for the
        # same reason.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install Dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      # plugin-runtime's boundary-debugger suite drives a real chromium through
      # the playwright installed in the rstest browser fixture. The key is
      # derived from the frozen lockfile that resolves that playwright, so a
      # bump invalidates the cache without any workflow-side version literal.
      # No restore-keys: the lockfile hash is the invalidation mechanism.
      - name: Restore Playwright chromium cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser qualification runtime
        run: |
          # OS packages are not in ~/.cache/ms-playwright, so install-deps
          # runs on every run; only the browser download is cacheable.
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
            mise exec -- pnpm --dir tests/integration/rstest/basic-app-rstest-browser exec playwright install-deps chromium
          else
            mise exec -- pnpm --dir tests/integration/rstest/basic-app-rstest-browser exec playwright install --with-deps chromium
          fi

      - name: Qualify release source
        run: |
          # Script qualification imports public package entry points, and these
          # suites do not run from source alone: bff-core's fixtures import its
          # own dist/esm-node/index.mjs by absolute path, and the plugin-i18n
          # and plugin-bff type fixtures resolve @modern-js/runtime and
          # @modern-js/create-request through their exports maps, which point at
          # dist/types. The create CLI fixture also loads plugin-i18n and
          # plugin-tanstack from their built public entries. A clean checkout
          # has none of it, so build every tested package and dependency
          # closure before tests. One invocation with every closure so nx plans
          # a single graph; each closure still completes before its first
          # consumer below.
          mise exec -- pnpm \
            --filter "@modern-js/ultramodern-create^..." \
            --filter "@modern-js/app-tools..." \
            --filter "@modern-js/image..." \
            --filter "@modern-js/runtime..." \
            --filter "@modern-js/plugin-i18n..." \
            --filter "@modern-js/plugin-tanstack..." \
            --filter "@modern-js/plugin-bff..." \
            --filter "@modern-js/bff-core..." \
            build
          # Repository-state boundary snapshots remain enforced by the dedicated
          # boundary workflow; stale bookkeeping must not reject valid release bytes.
          NODE_OPTIONS='--test-skip-pattern=^(?:repo\x20allowlist\x20has\x20no\x20new\x20upstream-owned\x20imports\x20of\x20fork-only\x20code|full\x20recorded\x20repository\x20scope\x20remains\x20green\x20and\x20fully\x20measured)$' \
            mise exec -- pnpm test:scripts
          mise exec -- pnpm lint
          mise exec -- pnpm run check-changeset
          # @modern-js/ultramodern-create's own test script rebuilds only itself; every
          # installed framework boundary it exercises is already built above.
          mise exec -- pnpm --filter @modern-js/ultramodern-create test
          # The behavioural surface of the published runtime packages. Without
          # these, a dispatch on a commit whose ut-* workflows are red would
          # still publish to npm at dist-tag latest.
          mise exec -- pnpm test:ut \
            --project plugin-runtime-node \
            --project plugin-runtime-client \
            --project plugin-i18n-node \
            --project plugin-i18n-client \
            --project @modern-js/plugin-bff \
            --project @modern-js/bff-core

  prepare-release:
    name: Build the immutable @bleedingdev release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    outputs:
      producer_artifact_identity: ${{ steps.producer-identity.outputs.artifact_identity }}
      producer_run_attempt: ${{ steps.producer-identity.outputs.run_attempt }}
      producer_run_identity: ${{ steps.producer-identity.outputs.run_identity }}
      release_source_commit: ${{ steps.verify-bundle.outputs.source_commit }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        # Full history is kept deliberately: the release bundle is built from
        # the same complete checkout qualify-source qualifies. Matches
        # ultramodern-nightly.yml and boundary-anti-patterns.yml.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install Dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Reject an already published source cohort
        if: inputs.recovery_run_id == ''
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { assertRegistrySourceCommitUnpublished } from './scripts/ultramodern-publish/prepare-bleedingdev-packages.mjs';

          const packageName = '@bleedingdev/modern-js-ultramodern-create';
          const requestedVersion = process.env.PUBLISH_VERSION;
          const sourceCommit = process.env.GITHUB_SHA;
          const sourceRepository = process.env.GITHUB_REPOSITORY;

          await assertRegistrySourceCommitUnpublished({
            packageName,
            requestedVersion,
            sourceCommit,
            sourceRepository,
          });
          NODE

      - name: Build Packages
        if: inputs.recovery_run_id == ''
        run: mise exec -- pnpm ultramodern:build-bleedingdev-publish

      - name: Prepare exact release tarballs and manifest
        if: inputs.recovery_run_id == ''
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          PUBLISH_TAG: ${{ env.BLEEDINGDEV_PUBLISH_TAG }}
        run: |
          # --include-sidecars stages the version-preserving @bleedingdev
          # sidecars beside the cohort (own stable versions, own scope, never
          # rewritten) and validates that every npm: alias literal in the staged
          # cohort names a sidecar this run actually stages, at that exact
          # version. It packs each sidecar once, records its exact digests in
          # sidecars.json, and binds that manifest into manifest.json and the cohort
          # digest. Staging-only by construction: the
          # CLI refuses --include-sidecars together with a publish flag.
          mise exec -- pnpm ultramodern:prepare-bleedingdev-publish -- \
            --version "$PUBLISH_VERSION" \
            --tag "$PUBLISH_TAG" \
            --include-sidecars

      - name: Download previously accepted release bundle
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ format('{0}-run-{1}-attempt-{2}', env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT, inputs.recovery_run_id, inputs.recovery_run_attempt) }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run_id }}

      - name: Download previous release acceptance receipt
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ format('{0}-run-{1}-attempt-{2}', env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT, inputs.recovery_run_id, inputs.recovery_run_attempt) }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run_id }}

      - name: Verify previously accepted release bundle
        if: inputs.recovery_run_id != ''
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery_run_attempt }}
        run: |
          recovery_run_identity="github:${GITHUB_REPOSITORY}:run:${RECOVERY_RUN_ID}:attempt:${RECOVERY_RUN_ATTEMPT}"
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "$recovery_run_identity"
          node scripts/ultramodern-production-readiness/published-create-proof/acceptance-receipt.mjs \
            --verify \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "$recovery_run_identity"

      - name: Verify release bundle identity
        id: verify-bundle
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import { verifyReleaseArtifacts } from './scripts/ultramodern-publish/prepare-bleedingdev-packages.mjs';

          const release = verifyReleaseArtifacts(process.env.BLEEDINGDEV_RELEASE_DIR, {
            tag: process.env.BLEEDINGDEV_PUBLISH_TAG,
            version: process.env.PUBLISH_VERSION,
          });
          if (release.manifest.source.repository !== process.env.GITHUB_REPOSITORY) {
            throw new Error('Release artifact repository does not match this repository');
          }
          execFileSync(
            'git',
            ['merge-base', '--is-ancestor', release.manifest.source.commit, process.env.GITHUB_SHA],
            { stdio: 'inherit' },
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `source_commit=${release.manifest.source.commit}\n`,
          );
          NODE

      # Offline: fails the producer if the staged sidecar lane is malformed,
      # mis-ordered, or not addressed at the cohort package that aliases it, so
      # a broken lane never reaches an OIDC-bearing job.
      - name: Verify the staged sidecar publication lane
        run: |
          node scripts/ultramodern-publish/publish-sidecars.mjs \
            --check-staging \
            --out "$BLEEDINGDEV_RELEASE_DIR" \
            --tag "$BLEEDINGDEV_PUBLISH_TAG"

      - name: Verify release bundle output shape
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          for (const file of [
            process.env.BLEEDINGDEV_RELEASE_MANIFEST,
            process.env.BLEEDINGDEV_RELEASE_MANIFEST_DIGEST,
            process.env.BLEEDINGDEV_RELEASE_COHORT_DIGEST,
          ]) {
            if (!fs.statSync(file, { throwIfNoEntry: false })?.isFile()) {
              throw new Error(`Missing release bundle file: ${file}`);
            }
          }

          const tarballDir = path.join(process.env.BLEEDINGDEV_RELEASE_DIR, 'tarballs');
          const tarballs = fs.readdirSync(tarballDir, { withFileTypes: true });
          if (tarballs.length === 0 || tarballs.some(entry => !entry.isFile() || !entry.name.endsWith('.tgz'))) {
            throw new Error('Release bundle tarballs/ must contain only final .tgz files');
          }
          NODE

      - name: Bind immutable producer identity
        id: producer-identity
        run: |
          run_attempt="$GITHUB_RUN_ATTEMPT"
          artifact_identity="run-${GITHUB_RUN_ID}-attempt-${run_attempt}"
          run_identity="github:${GITHUB_REPOSITORY}:run:${GITHUB_RUN_ID}:attempt:${run_attempt}"
          {
            printf 'artifact_identity=%s\n' "$artifact_identity"
            printf 'run_attempt=%s\n' "$run_attempt"
            printf 'run_identity=%s\n' "$run_identity"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ steps.producer-identity.outputs.artifact_identity }}
          path: |
            .modern/bleedingdev-publish/manifest.json
            .modern/bleedingdev-publish/manifest.json.sha256
            .modern/bleedingdev-publish/cohort.sha256
            .modern/bleedingdev-publish/tarballs/*.tgz
            .modern/bleedingdev-publish/sidecars.json
            .modern/bleedingdev-publish/sidecar-tarballs/*.tgz
          if-no-files-found: error
          include-hidden-files: true

  accept-release:
    name: Clean-room acceptance of the immutable release bundle
    # Runner-label indirection: with BLEEDINGDEV_ACCEPT_RUNNER_LABELS unset the
    # expression resolves to ubuntu-latest (byte-identical behavior). Setting
    # the repository variable to a JSON string (e.g. '"ubuntu-latest-8-cores"'
    # or '["self-hosted","linux"]') moves only the two acceptance jobs to
    # bigger runners without touching the publish trust chain.
    runs-on: ${{ fromJSON(vars.BLEEDINGDEV_ACCEPT_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 120
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../ms-playwright
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    needs:
      - prepare-release
    outputs:
      producer_artifact_identity: ${{ needs.prepare-release.outputs.producer_artifact_identity }}
      producer_run_attempt: ${{ needs.prepare-release.outputs.producer_run_attempt }}
      producer_run_identity: ${{ needs.prepare-release.outputs.producer_run_identity }}
      release_source_commit: ${{ needs.prepare-release.outputs.release_source_commit }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout acceptance runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

      # Scoped cache namespace: this job installs only the 5-package
      # @scripts/ultramodern-production-readiness closure, so it restores a
      # store sized to that closure instead of the full-monorepo store the
      # qualify/prepare jobs need.
      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-accept-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-accept-${{ runner.os }}-

      - name: Install acceptance runner dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts --filter @scripts/ultramodern-production-readiness

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ needs.prepare-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      # Resolves the same browser-smoke runtime the acceptance profile uses and
      # reports its playwright version, so the cache key below comes from a
      # resolved runtime output instead of a workflow version literal.
      - name: Resolve browser smoke runtime
        id: browser-runtime
        run: node scripts/ultramodern-production-readiness/provision-acceptance-browsers.mjs --resolve

      # No restore-keys: the resolved playwright version is the invalidation
      # mechanism.
      - name: Restore Playwright chromium cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Install browser smoke runtime
        run: >-
          node scripts/ultramodern-production-readiness/provision-acceptance-browsers.mjs
          --install --cache-hit ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}

      - name: Run exact-artifact ERP-10 acceptance
        env:
          # Opt-in workspace build parallelism for larger self-hosted runners;
          # unset (the hosted default) leaves the acceptance profile untouched.
          BLEEDINGDEV_ACCEPT_BUILD_CONCURRENCY: ${{ vars.BLEEDINGDEV_ACCEPT_BUILD_CONCURRENCY }}
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "${{ needs.prepare-release.outputs.producer_run_identity }}"

      - name: Upload release acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT }}-${{ needs.prepare-release.outputs.producer_artifact_identity }}
          path: |
            .modern/bleedingdev-publish/acceptance-receipt.json
            .modern/bleedingdev-publish/acceptance-receipt.operational-independence.json
          if-no-files-found: error
          include-hidden-files: true

  validate-release:
    name: Validate accepted @bleedingdev tarballs without publish authority
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == true
    needs:
      - publish-security
      - qualify-source
      - accept-release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout exact-artifact validation CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Download accepted release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download release acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify exact release acceptance receipt
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "${{ needs.accept-release.outputs.producer_run_identity }}"

          node scripts/ultramodern-production-readiness/published-create-proof/acceptance-receipt.mjs \
            --verify \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "${{ needs.accept-release.outputs.producer_run_identity }}"

      - name: Validate only the accepted tarballs
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          PUBLISH_TAG: ${{ env.BLEEDINGDEV_PUBLISH_TAG }}
          PUBLISH_CONCURRENCY: ${{ env.BLEEDINGDEV_PUBLISH_CONCURRENCY }}
        run: |
          node scripts/ultramodern-publish/prepare-bleedingdev-packages.mjs \
            --publish-existing \
            --dry-run \
            --out "$BLEEDINGDEV_RELEASE_DIR" \
            --version "$PUBLISH_VERSION" \
            --tag "$PUBLISH_TAG" \
            --publish-concurrency "$PUBLISH_CONCURRENCY"

      # The same registry reconciliation publish-sidecars performs, without
      # publishing and without OIDC: a dry run reports what the sidecar lane
      # would do and fails closed on any registry content/version mismatch.
      - name: Validate the sidecar publication lane against the registry
        run: |
          node scripts/ultramodern-publish/publish-sidecars.mjs \
            --dry-run \
            --out "$BLEEDINGDEV_RELEASE_DIR" \
            --tag "$BLEEDINGDEV_PUBLISH_TAG"

  # Sidecars are NOT cohort members: they keep their own stable versions and
  # their own scope, and they are published from this dedicated job strictly
  # BEFORE the cohort. @bleedingdev/modern-js-image pins them through
  # `npm:@bleedingdev/<name>@<exact version>` alias specifiers, which npm can
  # only resolve once those exact versions exist on the registry. `publish`
  # declares this job in `needs`, so a failed or skipped sidecar publication
  # makes the cohort publish unreachable rather than shipping a cohort whose
  # image package cannot install. Trusted publishing only: id-token: write and
  # the npm-publish environment, no token secret.
  publish-sidecars:
    name: Publish the stable sidecars before the cohort
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 45
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == false
    needs:
      - publish-security
      - qualify-source
      - accept-release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout exact-artifact sidecar publish CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Download accepted release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download release acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify exact release acceptance receipt
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "${{ needs.accept-release.outputs.producer_run_identity }}"

          node scripts/ultramodern-production-readiness/published-create-proof/acceptance-receipt.mjs \
            --verify \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "${{ needs.accept-release.outputs.producer_run_identity }}"

      - name: Publish the staged sidecars in alias order
        run: |
          # Publish the exact tarball bytes bound by the accepted release identity.
          # An already-published version is reused only when registry integrity
          # and shasum match those accepted bytes, so a re-run after a mid-lane
          # failure converges. Every other registry state - byte drift on that
          # version, a dist-tag pointing
          # elsewhere, a version the dist-tag claims but the registry lacks, a
          # backwards republish - fails the job and therefore the cohort.
          node scripts/ultramodern-publish/publish-sidecars.mjs \
            --out "$BLEEDINGDEV_RELEASE_DIR" \
            --tag "$BLEEDINGDEV_PUBLISH_TAG"

  publish:
    name: Publish accepted @bleedingdev tarballs
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 45
    outputs:
      publication_run_attempt: ${{ steps.release-identity.outputs.publication_run_attempt }}
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == false
    needs:
      - publish-security
      - qualify-source
      - accept-release
      # Hard ordering gate: the cohort's @bleedingdev/modern-js-image aliases
      # resolve only after these exact sidecar versions are on the registry.
      # A failed or skipped publish-sidecars makes this job unreachable.
      - publish-sidecars
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout exact-artifact publish CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Download accepted release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download release acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify exact release acceptance receipt
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "${{ needs.accept-release.outputs.producer_run_identity }}"

          node scripts/ultramodern-production-readiness/published-create-proof/acceptance-receipt.mjs \
            --verify \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "${{ needs.accept-release.outputs.producer_run_identity }}"

      - name: Prepare non-dry-run release identity
        id: release-identity
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.accept-release.outputs.release_source_commit }}
          PRODUCER_ARTIFACT_IDENTITY: ${{ needs.accept-release.outputs.producer_artifact_identity }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.accept-release.outputs.producer_run_attempt }}
          PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
          PUBLICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const readJson = file => JSON.parse(fs.readFileSync(file, 'utf8'));
          const sha256 = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const hasExactKeys = (value, expected) =>
            value !== null &&
            typeof value === 'object' &&
            !Array.isArray(value) &&
            JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...expected].sort());
          const manifest = readJson(process.env.BLEEDINGDEV_RELEASE_MANIFEST);
          const manifestSha256 = sha256(process.env.BLEEDINGDEV_RELEASE_MANIFEST);
          const detachedManifestSha256 = fs.readFileSync(
            process.env.BLEEDINGDEV_RELEASE_MANIFEST_DIGEST,
            'utf8',
          );
          const detachedCohortSha256 = fs.readFileSync(
            process.env.BLEEDINGDEV_RELEASE_COHORT_DIGEST,
            'utf8',
          );
          const runId = process.env.GITHUB_RUN_ID;

          if (
            manifest.schema !== 'bleedingdev.ultramodern.release-manifest' ||
            manifest.schemaVersion !== 3
          ) {
            throw new Error(`Unknown release manifest schema ${manifest.schema}@${manifest.schemaVersion}`);
          }
          if (
            !hasExactKeys(manifest, [
              'aliases',
              'cohortDigest',
              'cohortProjection',
              'dependencyGraph',
              'packages',
              'publishOrder',
              'release',
              'schema',
              'schemaVersion',
              'sidecars',
              'source',
              'tools',
            ]) ||
            !hasExactKeys(manifest.source, ['commit', 'repository']) ||
            !hasExactKeys(manifest.release, ['tag', 'version']) ||
            !hasExactKeys(manifest.tools, ['node', 'npm', 'pnpm']) ||
            !Array.isArray(manifest.packages) ||
            manifest.packages.length === 0 ||
            !Array.isArray(manifest.publishOrder)
          ) {
            throw new Error('Release manifest does not match the strict v3 shape');
          }
          if (
            detachedManifestSha256 !== `${manifestSha256}  manifest.json\n` ||
            detachedCohortSha256 !== `${manifest.cohortDigest}\n`
          ) {
            throw new Error('Detached release manifest or cohort digest is invalid');
          }

          if (manifest.release.version !== process.env.PUBLISH_VERSION) {
            throw new Error(`Release manifest version ${manifest.release.version} does not match ${process.env.PUBLISH_VERSION}`);
          }
          if (
            manifest.release.tag !== process.env.BLEEDINGDEV_PUBLISH_TAG ||
            manifest.source.commit !== process.env.SOURCE_COMMIT ||
            manifest.source.repository !== process.env.GITHUB_REPOSITORY
          ) {
            throw new Error('Release manifest source or release identity does not match this publish');
          }
          const identity = {
            schema: 'bleedingdev.ultramodern.published-release-identity',
            schemaVersion: 2,
            releaseRunId: runId,
            producerArtifactIdentity: process.env.PRODUCER_ARTIFACT_IDENTITY,
            producerRunAttempt: process.env.PRODUCER_RUN_ATTEMPT,
            producerRunIdentity: process.env.PRODUCER_RUN_IDENTITY,
            publicationRunAttempt: process.env.PUBLICATION_RUN_ATTEMPT,
            source: manifest.source,
            release: manifest.release,
            cohortDigest: manifest.cohortDigest,
            manifestSha256,
            acceptanceReceiptSha256: sha256(process.env.BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT),
            dryRun: false,
          };
          fs.writeFileSync(
            process.env.BLEEDINGDEV_RELEASE_IDENTITY,
            `${JSON.stringify(identity, null, 2)}\n`,
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `publication_run_attempt=${process.env.PUBLICATION_RUN_ATTEMPT}\n`,
          );
          NODE

      - name: Publish only the accepted tarballs
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          PUBLISH_TAG: ${{ env.BLEEDINGDEV_PUBLISH_TAG }}
          PUBLISH_CONCURRENCY: ${{ env.BLEEDINGDEV_PUBLISH_CONCURRENCY }}
        run: |
          node scripts/ultramodern-publish/prepare-bleedingdev-packages.mjs \
            --publish-existing \
            --out "$BLEEDINGDEV_RELEASE_DIR" \
            --version "$PUBLISH_VERSION" \
            --tag "$PUBLISH_TAG" \
            --publish-concurrency "$PUBLISH_CONCURRENCY"

      - name: Upload published release identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BLEEDINGDEV_RELEASE_IDENTITY_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}-publication-attempt-${{ github.run_attempt }}
          path: |
            .modern/bleedingdev-publish/manifest.json
            .modern/bleedingdev-publish/manifest.json.sha256
            .modern/bleedingdev-publish/cohort.sha256
            .modern/bleedingdev-publish/sidecars.json
            .modern/bleedingdev-publish/sidecar-tarballs/*.tgz
            .modern/bleedingdev-publish/tarballs/*.tgz
            .modern/bleedingdev-publish/acceptance-receipt.json
            .modern/bleedingdev-publish/acceptance-receipt.operational-independence.json
            .modern/bleedingdev-publish/release-identity.json
          if-no-files-found: error
          include-hidden-files: true

  # npm trusted-publishing OIDC cannot mutate dist-tags or approve a staged
  # cohort. `latest` is therefore already public here; this job is an immediate
  # same-workflow registry-byte gate, not a pre-exposure gate or rollback.
  accept-published:
    name: Accept the exact published registry cohort
    # Same runner-label indirection as accept-release; unset => ubuntu-latest.
    runs-on: ${{ fromJSON(vars.BLEEDINGDEV_ACCEPT_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 120
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../ms-playwright
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == false
    needs:
      - publish
      - accept-release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout published acceptance runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Download exact published release identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_IDENTITY_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}-publication-attempt-${{ needs.publish.outputs.publication_run_attempt }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify accepted producer receipt for published acceptance
        env:
          PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --expected-mode source \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "$PRODUCER_RUN_IDENTITY"

      - name: Verify exact published release identity
        env:
          PUBLICATION_RUN_ATTEMPT: ${{ needs.publish.outputs.publication_run_attempt }}
          PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.BLEEDINGDEV_RELEASE_MANIFEST, 'utf8'));
          const identity = JSON.parse(fs.readFileSync(process.env.BLEEDINGDEV_RELEASE_IDENTITY, 'utf8'));
          const sha256 = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          if (
            identity.schema !== 'bleedingdev.ultramodern.published-release-identity' ||
            identity.schemaVersion !== 2 ||
            identity.dryRun !== false ||
            identity.releaseRunId !== process.env.GITHUB_RUN_ID ||
            String(identity.publicationRunAttempt) !== process.env.PUBLICATION_RUN_ATTEMPT ||
            identity.producerRunIdentity !== process.env.PRODUCER_RUN_IDENTITY ||
            identity.manifestSha256 !== sha256(process.env.BLEEDINGDEV_RELEASE_MANIFEST) ||
            identity.acceptanceReceiptSha256 !== sha256(process.env.BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT) ||
            identity.cohortDigest !== manifest.cohortDigest ||
            identity.release.version !== manifest.release.version ||
            identity.release.tag !== manifest.release.tag ||
            identity.source.commit !== manifest.source.commit ||
            identity.source.repository !== manifest.source.repository
          ) {
            throw new Error('Published release identity does not bind the downloaded exact release');
          }
          NODE

      # The cohort wait only reads the registry and the downloaded bundle (the
      # publish scripts import node: builtins and the committed vendored semver
      # only), so it runs in the background while the two installs below fetch
      # node_modules and chromium. A wait-loop failure therefore surfaces after
      # those installs instead of before them, in "Await the exact registry
      # cohort" — deliberate, and the only ordering this trades away.
      - name: Start the exact registry cohort wait
        env:
          PUBLISH_CONCURRENCY: ${{ env.BLEEDINGDEV_PUBLISH_CONCURRENCY }}
          PUBLISH_TAG: ${{ env.BLEEDINGDEV_PUBLISH_TAG }}
          PUBLISH_VERSION: ${{ inputs.version }}
        run: |
          (
            status=1
            for attempt in {1..12}; do
              if node scripts/ultramodern-publish/prepare-bleedingdev-packages.mjs \
                --publish-existing \
                --dry-run \
                --out "$BLEEDINGDEV_RELEASE_DIR" \
                --version "$PUBLISH_VERSION" \
                --tag "$PUBLISH_TAG" \
                --publish-concurrency "$PUBLISH_CONCURRENCY"; then
                status=0
                break
              fi
              if [[ "$attempt" == "12" ]]; then
                echo "Exact registry cohort did not become verifiable" >&2
                status=1
                break
              fi
              sleep 15
            done
            printf '%s\n' "$status" > "$RUNNER_TEMP/registry-cohort-wait.status"
            exit "$status"
          ) > "$RUNNER_TEMP/registry-cohort-wait.log" 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/registry-cohort-wait.pid"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

      # Scoped cache namespace: same rationale as accept-release — this job
      # installs only the @scripts/ultramodern-production-readiness closure.
      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-accept-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-accept-${{ runner.os }}-

      # Backgrounded so it overlaps the playwright install below; the join
      # step surfaces its log and status before anything depends on
      # node_modules. Runs after the store restore so the restored CAS is
      # present. Same background/pid/status idiom as the cohort wait above.
      - name: Start published acceptance runner dependency install
        run: |
          (
            status=0
            mise exec -- pnpm install --frozen-lockfile --ignore-scripts --filter @scripts/ultramodern-production-readiness || status=$?
            printf '%s\n' "$status" > "$RUNNER_TEMP/deps-install.status"
            exit "$status"
          ) > "$RUNNER_TEMP/deps-install.log" 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/deps-install.pid"

      # Runs while the dependency install above is still in flight: the
      # provisioning module imports node builtins and repo-local helpers only,
      # so it needs no node_modules. It reports the resolved playwright version
      # that keys the cache below, replacing a workflow version literal.
      - name: Resolve browser smoke runtime
        id: browser-runtime
        run: node scripts/ultramodern-production-readiness/provision-acceptance-browsers.mjs --resolve

      # No restore-keys: the resolved playwright version is the invalidation
      # mechanism.
      - name: Restore Playwright chromium cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Install browser smoke runtime
        run: >-
          node scripts/ultramodern-production-readiness/provision-acceptance-browsers.mjs
          --install --cache-hit ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}

      # Unconditional join before anything that needs node_modules: a failed
      # install fails the job here, never silently.
      - name: Join published acceptance runner dependency install
        run: |
          pid="$(cat "$RUNNER_TEMP/deps-install.pid")"
          while kill -0 "$pid" 2>/dev/null; do
            sleep 2
          done
          cat "$RUNNER_TEMP/deps-install.log"
          exit "$(cat "$RUNNER_TEMP/deps-install.status")"

      - name: Await the exact registry cohort
        run: |
          # The loop is not a child of this shell, so poll the pid and read the
          # status it recorded rather than using `wait`.
          pid="$(cat "$RUNNER_TEMP/registry-cohort-wait.pid")"
          while kill -0 "$pid" 2>/dev/null; do
            sleep 5
          done
          cat "$RUNNER_TEMP/registry-cohort-wait.log"
          exit "$(cat "$RUNNER_TEMP/registry-cohort-wait.status")"

      - name: Run published ERP-10 acceptance
        env:
          PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
          PUBLISH_VERSION: ${{ inputs.version }}
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --mode published \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --expected-source-revision "${{ needs.accept-release.outputs.release_source_commit }}" \
            --expected-version "$PUBLISH_VERSION" \
            --scale-profile erp-10 \
            --registry-url https://registry.npmjs.org/ \
            --receipt "$BLEEDINGDEV_PUBLISHED_ACCEPTANCE_RECEIPT" \
            --run-identity "$PRODUCER_RUN_IDENTITY"

      - name: Upload published acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BLEEDINGDEV_PUBLISHED_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}-publication-attempt-${{ needs.publish.outputs.publication_run_attempt }}
          path: |
            .modern/bleedingdev-publish/published-acceptance-receipt.json
          if-no-files-found: error
          include-hidden-files: true

  tractor-downstream:
    name: Accept the exact published cohort in Tractor
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == false
    # Runs beside accept-published rather than behind it. record-publish-outcome
    # below still requires both, so evidence ordering is unchanged; only the
    # scheduling is. The callee re-runs the registry cohort gate itself
    # (wait_for_registry_cohort) because it may now start before this workflow's
    # own cohort wait has passed.
    needs:
      - prepare-release
      - publish
    uses: ./.github/workflows/ultramodern-tractor-downstream.yml
    with:
      release_bundle_artifact: bleedingdev-release-bundle-${{ needs.prepare-release.outputs.producer_artifact_identity }}
      wait_for_registry_cohort: true
      # Advance this reviewed immutable baseline after every accepted Tractor update.
      tractor_ref: 2ec6d74ee66085b6895ec0f8ff4180385c713c58

  record-publish-outcome:
    name: Record the authenticated publish outcome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.publish-outcome.outputs.artifact_name }}
    needs:
      - publish-security
      - accept-release
      - validate-release
      - publish-sidecars
      - publish
      - accept-published
      - tractor-downstream
    if: >-
      always() &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      (
        (inputs.dry_run == true && needs.validate-release.result == 'success' && needs.publish-sidecars.result == 'skipped' && needs.publish.result == 'skipped') ||
        (inputs.dry_run == false && needs.publish-sidecars.result == 'success' && needs.publish.result == 'success' && needs.accept-published.result == 'success' && needs.tractor-downstream.result == 'success' && needs.validate-release.result == 'skipped')
      )
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      PRODUCER_ARTIFACT_IDENTITY: ${{ needs.accept-release.outputs.producer_artifact_identity }}
      PRODUCER_RUN_ATTEMPT: ${{ needs.accept-release.outputs.producer_run_attempt }}
      PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
      RELEASE_SOURCE_COMMIT: ${{ needs.accept-release.outputs.release_source_commit }}
      PUBLISH_VERSION: ${{ inputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout exact-outcome recorder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Download accepted release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download release acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download published acceptance evidence
        if: inputs.dry_run == false
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_PUBLISHED_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}-publication-attempt-${{ needs.publish.outputs.publication_run_attempt }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download Tractor acceptance evidence
        if: inputs.dry_run == false
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ needs.tractor-downstream.outputs.evidence_artifact_name }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify accepted producer receipt for the outcome
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "$PRODUCER_RUN_IDENTITY"

      - name: Verify published receipt for the outcome
        if: inputs.dry_run == false
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --expected-mode published \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_PUBLISHED_ACCEPTANCE_RECEIPT" \
            --run-identity "$PRODUCER_RUN_IDENTITY"

      - name: Create publish outcome
        id: publish-outcome
        run: |
          publication_identity=()
          published_evidence=()
          tractor_evidence=()
          if [[ "$DRY_RUN" == "false" ]]; then
            publication_identity=(
              --publication-run-attempt "${{ needs.publish.outputs.publication_run_attempt }}"
            )
            published_evidence=(
              --published-receipt "$BLEEDINGDEV_PUBLISHED_ACCEPTANCE_RECEIPT"
            )
            tractor_evidence=(
              --tractor-report "$BLEEDINGDEV_RELEASE_DIR/tractor-downstream-acceptance.json"
              --tractor-report-sha256 "${{ needs.tractor-downstream.outputs.report_sha256 }}"
              --tractor-baseline-revision "${{ needs.tractor-downstream.outputs.baseline_revision }}"
            )
          fi
          node scripts/ultramodern-publish/publish-outcome.mjs create \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --manifest-digest "$BLEEDINGDEV_RELEASE_MANIFEST_DIGEST" \
            --cohort-digest "$BLEEDINGDEV_RELEASE_COHORT_DIGEST" \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --operational-evidence "${BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT%.json}.operational-independence.json" \
            "${publication_identity[@]}" \
            "${published_evidence[@]}" \
            "${tractor_evidence[@]}" \
            --out "$BLEEDINGDEV_PUBLISH_OUTCOME" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$RELEASE_SOURCE_COMMIT" \
            --version "$PUBLISH_VERSION" \
            --tag "$BLEEDINGDEV_PUBLISH_TAG" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-artifact-identity "$PRODUCER_ARTIFACT_IDENTITY" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --producer-run-identity "$PRODUCER_RUN_IDENTITY" \
            --dry-run "$DRY_RUN" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload publish outcome
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.publish-outcome.outputs.artifact_name }}
          path: |
            .modern/bleedingdev-publish/manifest.json
            .modern/bleedingdev-publish/manifest.json.sha256
            .modern/bleedingdev-publish/cohort.sha256
            .modern/bleedingdev-publish/tarballs/*.tgz
            .modern/bleedingdev-publish/sidecars.json
            .modern/bleedingdev-publish/sidecar-tarballs/*.tgz
            .modern/bleedingdev-publish/acceptance-receipt.json
            .modern/bleedingdev-publish/acceptance-receipt.operational-independence.json
            .modern/bleedingdev-publish/published-acceptance-receipt.json
            .modern/bleedingdev-publish/tractor-downstream-acceptance.json
            .modern/bleedingdev-publish/publish-outcome.json
          if-no-files-found: error
          include-hidden-files: true

  publish-change-record:
    name: Publish the cohort change record
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that may write to the repository, and it runs strictly after
    # the publish outcome is recorded.
    permissions:
      actions: read
      contents: write
    needs:
      - accept-release
      - record-publish-outcome
    if: >-
      always() &&
      needs.accept-release.result == 'success' &&
      needs.record-publish-outcome.result == 'success' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Download authenticated publish outcome
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ needs.record-publish-outcome.outputs.artifact_name }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Generate the cohort change record
        id: change-record
        env:
          RELEASE_SOURCE_COMMIT: ${{ needs.accept-release.outputs.release_source_commit }}
        run: |
          git checkout --detach "$RELEASE_SOURCE_COMMIT"
          mkdir -p "$BLEEDINGDEV_RELEASE_DIR"
          node scripts/ultramodern-publish/gen-cohort-change-record.mjs \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --out "$BLEEDINGDEV_RELEASE_DIR/change-record.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_VERSION: ${{ steps.change-record.outputs.version }}
          SOURCE_COMMIT: ${{ steps.change-record.outputs.source_commit }}
        run: |
          set -euo pipefail
          # FORK: this repository carries 271 inherited upstream Modern.js `v*`
          # tags (v1.x .. v3.4.0). `gh release create` REUSES a pre-existing tag
          # and silently ignores --target, so a fork release published under
          # `v$PUBLISH_VERSION` could point at an upstream commit. Namespace the
          # fork's releases away from `v*` and never move an existing tag.
          TAG="ultramodern-v$PUBLISH_VERSION"
          TITLE="@bleedingdev/modern-js-* $PUBLISH_VERSION"
          NOTES="$BLEEDINGDEV_RELEASE_DIR/change-record.md"

          EXISTING_TAG_SHA="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          if [ -n "$EXISTING_TAG_SHA" ] && [ "$EXISTING_TAG_SHA" != "$SOURCE_COMMIT" ]; then
            echo "::error::tag $TAG already exists at $EXISTING_TAG_SHA, not $SOURCE_COMMIT" >&2
            exit 1
          fi

          # Idempotent: the publish job runs BEFORE this one and is
          # unrollbackable, so a re-run must be able to converge instead of
          # failing permanently on an already-created release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_COMMIT" \
              --title "$TITLE" \
              --notes-file "$NOTES"
          fi

      - name: Upload the change record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bleedingdev-change-record-${{ steps.change-record.outputs.version }}
          path: .modern/bleedingdev-publish/change-record.md
          if-no-files-found: error
          include-hidden-files: true
