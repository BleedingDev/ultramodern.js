name: Label Issues

on:
  issues:
    types: [opened]

# The label step authenticates with REPO_SCOPED_TOKEN; keep the ambient
# GITHUB_TOKEN read-only.
permissions:
  contents: read

jobs:
  label:
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Label issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.REPO_SCOPED_TOKEN }}
          script: |
            const title = context.payload.issue.title

            if (title.startsWith('Benchmark')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['benchmark']
              })
            }
