name: Workflow Security

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/renovate.json'
      - 'packages/toolkit/ultramodern-create/template-workspace/.github/**'
      - 'scripts/security/**'
      - 'scripts/ultramodern-publish/**'
      - 'scripts/ultramodern-production-readiness/**'
      - 'package.json'
  push:
    branches:
      - main-ultramodern
    paths:
      - '.github/workflows/**'
      - '.github/renovate.json'
      - 'packages/toolkit/ultramodern-create/template-workspace/.github/**'
      - 'scripts/security/**'
      - 'scripts/ultramodern-publish/**'
      - 'scripts/ultramodern-production-readiness/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Install workflow parser
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts --filter @scripts/prebundle

      - name: Run validator unit tests
        run: |
          node --test scripts/security/__tests__/*.test.mjs
          node --test scripts/ultramodern-publish/__tests__/build-bleedingdev-packages.test.js
          node --test scripts/ultramodern-publish/__tests__/publish-security.test.js
          node --test scripts/ultramodern-production-readiness/__tests__/*.test.js

      - name: Validate workflow security
        run: node scripts/security/validate-github-workflows.mjs
