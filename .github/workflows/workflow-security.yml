name: Workflow Security

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/renovate.json'
      - 'packages/toolkit/create/template-workspace/.github/**'
      - 'scripts/security/**'
      - 'scripts/ultramodern-publish/**'
      - 'scripts/ultramodern-production-readiness/**'
      - 'package.json'
  push:
    branches:
      - main-ultramodern
    paths:
      - '.github/workflows/**'
      - '.github/renovate.json'
      - 'packages/toolkit/create/template-workspace/.github/**'
      - 'scripts/security/**'
      - 'scripts/ultramodern-publish/**'
      - 'scripts/ultramodern-production-readiness/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0

      - name: Install workflow parser
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts --filter @scripts/prebundle

      - name: Run validator unit tests
        run: |
          node --test scripts/security/__tests__/*.test.mjs
          node --test scripts/ultramodern-publish/__tests__/build-bleedingdev-packages.test.js
          node --test scripts/ultramodern-publish/__tests__/publish-security.test.js
          node --test scripts/ultramodern-production-readiness/__tests__/*.test.js

      - name: Validate workflow security
        run: node scripts/security/validate-github-workflows.mjs
