name: MV CI Hardening

on:
  pull_request:
    paths:
      - 'scripts/mv-ci-hardening/**'
      - 'docs/super-app-rfc-adr/CI-HARDENING-0001-mv-tier-budgets-and-flake-policy.md'
      - '.github/workflows/mv-ci-hardening.yml'
  workflow_dispatch:

jobs:
  mv-ci-hardening:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Validate MV CI hardening profile
        run: node scripts/mv-ci-hardening/validate-ci-hardening.js
