name: SuperApp Certification

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Certification profile to run'
        required: true
        default: 'release'
        type: choice
        options:
          - smoke
          - release
          - nightly
      run_upstream_drift:
        description: 'Merge origin/main in a disposable worktree and report drift'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
permissions:
  contents: read

jobs:
  superapp-certification:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 180
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          install: true

      - name: Setup Node.js 26.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Build Packages
        run: pnpm run prepare-build

      - name: Install Puppeteer
        run: cd ./tests/node_modules/puppeteer && npm run postinstall && cd ../..

      - name: Install Playwright browsers
        run: pnpm --dir tests/integration/rstest/basic-app-rstest-browser exec playwright install --with-deps chromium

      - name: Run SuperApp Certification
        env:
          PROFILE_INPUT: ${{ github.event.inputs.profile || 'release' }}
          RUN_UPSTREAM_DRIFT: ${{ github.event.inputs.run_upstream_drift || 'true' }}
        run: |
          ARGS=(
            --profile "$PROFILE_INPUT"
            --out-dir ".modern/superapp-certification/${PROFILE_INPUT}-${GITHUB_RUN_ID}"
          )

          if [ "$RUN_UPSTREAM_DRIFT" = "false" ]; then
            ARGS+=(--skip-upstream-drift)
          fi

          node scripts/superapp-certification/run-superapp-certification.js "${ARGS[@]}"

      - name: Generate Readiness Report
        if: always()
        run: |
          node scripts/superapp-certification/generate-readiness-report.js \
            --input-dir .modern/superapp-certification \
            --out-dir .modern/superapp-certification

      - name: Upload Certification Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: superapp-certification-${{ github.run_id }}
          path: .modern/superapp-certification/
          if-no-files-found: warn
