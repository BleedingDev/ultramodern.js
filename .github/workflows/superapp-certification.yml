name: SuperApp Certification

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Certification profile to run'
        required: true
        default: 'release'
        type: choice
        options:
          - smoke
          - release
          - nightly
      run_upstream_drift:
        description: 'Merge origin/main in a disposable worktree and report drift'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_drift_gates:
        description: 'Run root gates inside the disposable upstream-drift worktree'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    - cron: '17 2 * * 1-5'

jobs:
  superapp-certification:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SuperApp Certification
        env:
          PROFILE_INPUT: ${{ github.event.inputs.profile || 'nightly' }}
          RUN_UPSTREAM_DRIFT: ${{ github.event.inputs.run_upstream_drift || 'true' }}
          RUN_DRIFT_GATES: ${{ github.event.inputs.run_drift_gates || 'false' }}
        run: |
          ARGS=(
            --profile "$PROFILE_INPUT"
            --out-dir ".modern/superapp-certification/${PROFILE_INPUT}-${GITHUB_RUN_ID}"
          )

          if [ "$RUN_UPSTREAM_DRIFT" = "false" ]; then
            ARGS+=(--skip-upstream-drift)
          fi

          if [ "$RUN_DRIFT_GATES" = "true" ]; then
            ARGS+=(--drift-gates)
          fi

          node scripts/superapp-certification/run-superapp-certification.js "${ARGS[@]}"

      - name: Generate Readiness Report
        if: always()
        run: |
          node scripts/superapp-certification/generate-readiness-report.js \
            --input-dir .modern/superapp-certification \
            --out-dir .modern/superapp-certification

      - name: Upload Certification Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: superapp-certification-${{ github.run_id }}
          path: .modern/superapp-certification/
          if-no-files-found: warn
