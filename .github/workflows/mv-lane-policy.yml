name: MV Lane Policy

on:
  pull_request:
    paths:
      - 'scripts/mv-lane-policy/**'
      - 'docs/super-app-rfc-adr/LANE-POLICY-0001-golden-compat-experimental.md'
      - '.github/workflows/mv-lane-policy.yml'
  workflow_dispatch:

jobs:
  mv-lane-policy:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Validate MV Lane Policy
        run: node scripts/mv-lane-policy/validate-lane-policy.js
