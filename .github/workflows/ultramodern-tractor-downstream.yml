name: UltraModern Tractor Downstream Acceptance

on:
  workflow_call:
    inputs:
      mode:
        description: >-
          `published` accepts the exact cohort as npm serves it and is the only
          lane that produces promotable evidence. `source` rehearses the same
          immutable bundle before publication: this job starts its own throwaway
          loopback registry, seeds it from the verified bundle tarballs, and
          binds and uploads nothing.
        required: false
        type: string
        default: published
      release_bundle_artifact:
        description: Exact UltraModern release-bundle artifact name from this run
        required: true
        type: string
      tractor_ref:
        description: Immutable Tractor Store baseline commit
        required: true
        type: string
      wait_for_registry_cohort:
        description: >-
          Block on the exact published cohort becoming verifiable in the
          registry before acceptance. Required only when the caller schedules
          this acceptance before its own registry-cohort gate has passed.
        required: false
        type: boolean
        default: false
    outputs:
      baseline_revision:
        description: Immutable Tractor revision exercised by the acceptance
        value: ${{ jobs.tractor-downstream.outputs.baseline_revision }}
      evidence_artifact_name:
        description: Exact same-run Tractor acceptance artifact name
        value: ${{ jobs.tractor-downstream.outputs.evidence_artifact_name }}
      report_sha256:
        description: SHA-256 of the passing Tractor acceptance report
        value: ${{ jobs.tractor-downstream.outputs.report_sha256 }}

# No secrets, no environment, and no id-token: write anywhere in this workflow.
# Both lanes only read a registry - the published one reads npm, the rehearsal
# one reads a loopback registry it started itself - so neither can reach a
# publish credential.
permissions:
  actions: read
  contents: read

jobs:
  tractor-downstream:
    name: Exact cohort passes Tractor Node and workerd acceptance
    runs-on: ubuntu-latest
    # The rehearsal additionally starts and seeds a registry from the bundle
    # before the same downstream work begins.
    timeout-minutes: ${{ inputs.mode == 'source' && 75 || 45 }}
    outputs:
      baseline_revision: ${{ steps.evidence.outputs.baseline_revision }}
      evidence_artifact_name: ${{ steps.evidence.outputs.artifact_name }}
      report_sha256: ${{ steps.evidence.outputs.report_sha256 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      # Fail closed before anything is checked out: an unknown mode, or a
      # rehearsal asked to wait on a published cohort that by definition does
      # not exist yet, is a caller mistake.
      - name: Validate the acceptance mode
        env:
          MODE: ${{ inputs.mode }}
          WAIT_FOR_REGISTRY_COHORT: ${{ inputs.wait_for_registry_cohort }}
        run: |
          case "$MODE" in
            published|source) ;;
            *) echo "::error::unsupported Tractor acceptance mode: $MODE" >&2; exit 1 ;;
          esac
          if [[ "$MODE" == "source" && "$WAIT_FOR_REGISTRY_COHORT" == "true" ]]; then
            echo "::error::a source-mode rehearsal never waits on the published registry cohort" >&2
            exit 1
          fi

      - name: Checkout acceptance runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: modernjs
          persist-credentials: false

      - name: Checkout immutable Tractor baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          repository: BleedingDev/tractor-store-vertical-demo
          ref: ${{ inputs.tractor_ref }}
          path: tractor
          persist-credentials: false

      - name: Download exact release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ inputs.release_bundle_artifact }}
          path: modernjs/.modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          working_directory: tractor

      # Same retry shape as publish-bleedingdev.yml's "Wait for the exact
      # registry cohort". The version and tag come from the downloaded manifest,
      # which the publishing workflow already bound to its dispatch inputs
      # before publishing.
      - name: Wait for the exact registry cohort
        if: inputs.wait_for_registry_cohort
        working-directory: modernjs
        env:
          # Mirrors BLEEDINGDEV_PUBLISH_CONCURRENCY in publish-bleedingdev.yml.
          PUBLISH_CONCURRENCY: '8'
          RELEASE_DIR: .modern/bleedingdev-publish
        run: |
          read_release() {
            node -p "JSON.parse(require('node:fs').readFileSync('$RELEASE_DIR/manifest.json', 'utf8')).release.$1"
          }
          PUBLISH_VERSION="$(read_release version)"
          PUBLISH_TAG="$(read_release tag)"
          for attempt in {1..12}; do
            if node scripts/ultramodern-publish/prepare-bleedingdev-packages.mjs \
              --publish-existing \
              --dry-run \
              --out "$RELEASE_DIR" \
              --version "$PUBLISH_VERSION" \
              --tag "$PUBLISH_TAG" \
              --publish-concurrency "$PUBLISH_CONCURRENCY"; then
              exit 0
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Exact registry cohort did not become verifiable" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Provision Tractor acceptance dependencies
        working-directory: modernjs
        run: node scripts/ultramodern-publish/provision-tractor-acceptance.mjs

      # One acceptance implementation for both lanes. `published` names the real
      # registry; `source` names none, because the runner starts its own
      # ephemeral registry from the downloaded immutable bundle and refuses any
      # non-loopback URL. Nothing here builds, packs, or rewrites a tarball.
      - name: Run exact-cohort Tractor acceptance
        working-directory: tractor
        env:
          MODE: ${{ inputs.mode }}
        run: |
          registry=()
          if [[ "$MODE" == "published" ]]; then
            registry=(--registry-url https://registry.npmjs.org/)
          fi
          mise exec -- node \
            ../modernjs/scripts/ultramodern-production-readiness/run-tractor-downstream-acceptance.mjs \
            --mode "$MODE" \
            --manifest ../modernjs/.modern/bleedingdev-publish/manifest.json \
            --workspace . \
            "${registry[@]}" \
            --out ../modernjs/.modern/production-readiness/tractor-downstream-acceptance.json

      # Promotion is a published-lane concern only. A rehearsal binds nothing
      # and uploads nothing: its whole result is this job's own success, so
      # there is no source-mode artifact for anything downstream to consume.
      - name: Bind Tractor acceptance evidence
        id: evidence
        if: always() && inputs.mode == 'published'
        working-directory: modernjs
        env:
          TRACTOR_REF: ${{ inputs.tractor_ref }}
        run: node scripts/ultramodern-publish/bind-tractor-acceptance-evidence.mjs

      - name: Upload Tractor acceptance evidence
        if: always() && inputs.mode == 'published'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: modernjs/.modern/production-readiness/tractor-downstream-acceptance.json
          if-no-files-found: error
          include-hidden-files: true
