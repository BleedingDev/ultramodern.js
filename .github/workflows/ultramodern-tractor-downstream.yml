name: UltraModern Tractor Downstream Acceptance

on:
  workflow_call:
    inputs:
      release_bundle_artifact:
        description: Exact UltraModern release-bundle artifact name from this run
        required: true
        type: string
      tractor_ref:
        description: Immutable Tractor Store baseline commit
        required: true
        type: string
      wait_for_registry_cohort:
        description: >-
          Block on the exact published cohort becoming verifiable in the
          registry before acceptance. Required only when the caller schedules
          this acceptance before its own registry-cohort gate has passed.
        required: false
        type: boolean
        default: false
    outputs:
      baseline_revision:
        description: Immutable Tractor revision exercised by the acceptance
        value: ${{ jobs.tractor-downstream.outputs.baseline_revision }}
      evidence_artifact_name:
        description: Exact same-run Tractor acceptance artifact name
        value: ${{ jobs.tractor-downstream.outputs.evidence_artifact_name }}
      report_sha256:
        description: SHA-256 of the passing Tractor acceptance report
        value: ${{ jobs.tractor-downstream.outputs.report_sha256 }}

permissions:
  actions: read
  contents: read

jobs:
  tractor-downstream:
    name: Exact cohort passes Tractor Node and workerd acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      baseline_revision: ${{ steps.evidence.outputs.baseline_revision }}
      evidence_artifact_name: ${{ steps.evidence.outputs.artifact_name }}
      report_sha256: ${{ steps.evidence.outputs.report_sha256 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout acceptance runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: modernjs
          persist-credentials: false

      - name: Checkout immutable Tractor baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          repository: BleedingDev/tractor-store-vertical-demo
          ref: ${{ inputs.tractor_ref }}
          path: tractor
          persist-credentials: false

      - name: Download exact release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ inputs.release_bundle_artifact }}
          path: modernjs/.modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          working_directory: tractor

      # Same retry shape as publish-bleedingdev.yml's "Wait for the exact
      # registry cohort". The version and tag come from the downloaded manifest,
      # which the publishing workflow already bound to its dispatch inputs
      # before publishing.
      - name: Wait for the exact registry cohort
        if: inputs.wait_for_registry_cohort
        working-directory: modernjs
        env:
          # Mirrors BLEEDINGDEV_PUBLISH_CONCURRENCY in publish-bleedingdev.yml.
          PUBLISH_CONCURRENCY: '8'
          RELEASE_DIR: .modern/bleedingdev-publish
        run: |
          read_release() {
            node -p "JSON.parse(require('node:fs').readFileSync('$RELEASE_DIR/manifest.json', 'utf8')).release.$1"
          }
          PUBLISH_VERSION="$(read_release version)"
          PUBLISH_TAG="$(read_release tag)"
          for attempt in {1..12}; do
            if node scripts/ultramodern-publish/prepare-bleedingdev-packages.mjs \
              --publish-existing \
              --dry-run \
              --out "$RELEASE_DIR" \
              --version "$PUBLISH_VERSION" \
              --tag "$PUBLISH_TAG" \
              --publish-concurrency "$PUBLISH_CONCURRENCY"; then
              exit 0
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Exact registry cohort did not become verifiable" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Provision Tractor acceptance dependencies
        working-directory: modernjs
        run: node scripts/ultramodern-publish/provision-tractor-acceptance.mjs

      - name: Install Chromium
        working-directory: tractor
        run: mise exec -- npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Run exact-cohort Tractor acceptance
        working-directory: tractor
        run: >-
          mise exec -- node
          ../modernjs/scripts/ultramodern-production-readiness/run-tractor-downstream-acceptance.mjs
          --manifest ../modernjs/.modern/bleedingdev-publish/manifest.json
          --workspace .
          --registry-url https://registry.npmjs.org/
          --out ../modernjs/.modern/production-readiness/tractor-downstream-acceptance.json

      - name: Bind Tractor acceptance evidence
        id: evidence
        if: always()
        working-directory: modernjs
        env:
          TRACTOR_REF: ${{ inputs.tractor_ref }}
        run: node scripts/ultramodern-publish/bind-tractor-acceptance-evidence.mjs

      - name: Upload Tractor acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: modernjs/.modern/production-readiness/tractor-downstream-acceptance.json
          if-no-files-found: error
          include-hidden-files: true
