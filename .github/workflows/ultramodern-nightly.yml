name: Ultramodern Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: read

jobs:
  superapp-certification-nightly:
    name: Script, build-consumer and SuperApp acceptance
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 180
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache_save: false
          install: true

      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Restore only; ci-cache.yml seeds this key on main-ultramodern.
      - name: Restore pnpm store cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm run prepare-build

      - name: Run script test suites
        run: pnpm run test:scripts

      # scripts/lib/browser-provisioning.js is the one browser provisioner: it
      # reads the playwright the frozen install resolved for these runtimes,
      # and that version keys the browser cache.
      - name: Resolve Playwright runtime
        id: browser-runtime
        run: node scripts/lib/browser-provisioning.js --resolve --runtime tests/integration/ultramodern-sandpack-profile-smoke --runtime tests

      - name: Restore Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Install Playwright browsers
        run: >-
          node scripts/lib/browser-provisioning.js --install --runtime tests/integration/ultramodern-sandpack-profile-smoke --runtime tests
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Run built consumer acceptance
        run: pnpm run test:build-consumers

      - name: Run SuperApp certification nightly
        run: pnpm run validate:superapp-certification:nightly

      - name: Generate Readiness Report
        if: always()
        run: |
          node scripts/superapp-certification/generate-readiness-report.js \
            --input-dir .modern/superapp-certification \
            --out-dir .modern/superapp-certification

      - name: Upload certification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: superapp-certification-nightly-${{ github.run_id }}
          path: .modern/superapp-certification/
          if-no-files-found: warn

  nightly-signal:
    name: Aggregate nightly signal
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 5
    if: always()
    needs:
      - superapp-certification-nightly
    steps:
      - name: Report signal job results
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS_RESULTS"

      - name: Fail if any signal job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo 'At least one nightly signal job failed, was cancelled, or was skipped.'
          exit 1
