name: Ultramodern Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: read

jobs:
  script-tests:
    name: Gate validator and scripts/lib unit tests
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          install: true

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Run script test suites
        run: pnpm run test:scripts

  superapp-upstream-drift:
    name: SuperApp upstream drift probe
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          install: true

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Probe upstream merge drift
        run: pnpm run validate:superapp-upstream-drift

      - name: Upload drift summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: superapp-upstream-drift-${{ github.run_id }}
          path: .modern/superapp-certification/
          if-no-files-found: warn

  superapp-erp-tests:
    name: SuperApp ERP integration suite
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 90
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          install: true

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Build Packages
        run: pnpm run prepare-build

      - name: Install Puppeteer
        run: cd ./tests/node_modules/puppeteer && npm run postinstall && cd ../..

      - name: Run superapp-erp tests
        env:
          SUPERAPP_ERP_STRESS: '1'
          SUPERAPP_ERP_STRESS_ROUNDS: '4'
          SUPERAPP_ERP_STRESS_BATCH: '8'
          SUPERAPP_ERP_STRESS_ROUTE_CYCLES: '4'
          SUPERAPP_ERP_SOAK: '1'
          SUPERAPP_ERP_SOAK_MS: '120000'
        run: >-
          pnpm --dir tests exec rstest run -c rstest.config.mts
          integration/superapp-erp/tests/index.test.ts
          integration/superapp-erp/tests/stress.test.ts
          integration/superapp-erp/tests/soak.test.ts

  superapp-portfolio-tests:
    name: SuperApp portfolio integration suite
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 120
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          install: true

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Build Packages
        run: pnpm run prepare-build

      - name: Install Puppeteer
        run: cd ./tests/node_modules/puppeteer && npm run postinstall && cd ../..

      - name: Run superapp-portfolio tests
        env:
          SUPERAPP_PORTFOLIO_SECURITY: '1'
          SUPERAPP_PILOT_CHAOS: '1'
          SUPERAPP_PORTFOLIO_STRESS: '1'
          SUPERAPP_PORTFOLIO_STRESS_CYCLES: '6'
          SUPERAPP_PORTFOLIO_NIGHTLY: '1'
        run: >-
          pnpm --dir tests exec rstest run -c rstest.config.mts
          integration/superapp-portfolio/tests/index.test.ts
          integration/superapp-portfolio/tests/browser-runtime.test.ts
          integration/superapp-portfolio/tests/browser-runtime-matrix.test.ts
          integration/superapp-portfolio/tests/chaos-toggles.test.ts
          integration/superapp-portfolio/tests/effect-bff-contracts.test.ts
          integration/superapp-portfolio/tests/effect-tanstack-contract-behavior.test.ts
          integration/superapp-portfolio/tests/effect-tanstack-contract-coverage-artifact.test.ts
          integration/superapp-portfolio/tests/effect-tanstack-contract-map.test.ts
          integration/superapp-portfolio/tests/nightly.test.ts
          integration/superapp-portfolio/tests/pilot-chaos.test.ts
          integration/superapp-portfolio/tests/security.test.ts
          integration/superapp-portfolio/tests/stress.test.ts
          integration/superapp-portfolio/tests/workload-chaos-failure-taxonomy.test.ts
          integration/superapp-portfolio/tests/workload-chaos-matrix-artifact.test.ts
          integration/superapp-portfolio/tests/workload-data.test.ts
          integration/superapp-portfolio/tests/workload-reset-seed.test.ts
          integration/superapp-portfolio/tests/workload-validation-artifact.test.ts

  superapp-browser-matrix-tests:
    name: SuperApp browser matrix smoke
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 90
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          install: true

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Build Packages
        run: pnpm run prepare-build

      # The matrix suite resolves playwright from the rstest browser fixture
      # (see tests/integration/superapp-browser-matrix/tests/playwrightMatrix.test.ts),
      # so install browsers through that fixture to match its playwright version.
      # The default (smoke) matrix only exercises chromium.
      - name: Install Playwright browsers
        run: pnpm --dir tests/integration/rstest/basic-app-rstest-browser exec playwright install --with-deps chromium

      - name: Run superapp-browser-matrix tests
        run: >-
          pnpm --dir tests exec rstest run -c rstest.config.mts
          integration/superapp-browser-matrix/tests/playwrightMatrix.test.ts

  nightly-signal:
    name: Aggregate nightly signal
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 5
    if: always()
    needs:
      - script-tests
      - superapp-upstream-drift
      - superapp-erp-tests
      - superapp-portfolio-tests
      - superapp-browser-matrix-tests
    steps:
      - name: Report signal job results
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS_RESULTS"

      - name: Fail if any signal job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo 'At least one nightly signal job failed, was cancelled, or was skipped.'
          exit 1
