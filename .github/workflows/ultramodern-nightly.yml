name: Ultramodern Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: read

jobs:
  script-tests:
    name: Gate validator and scripts/lib unit tests
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true

      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x

      - name: Install Dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # The suites under scripts/ import built package dists
      # (e.g. @modern-js/app-tools/dist/esm-node), so build before testing.
      - name: Build Packages
        run: mise exec -- pnpm run prepare-build

      - name: Run script test suites
        run: pnpm run test:scripts

  superapp-certification-nightly:
    name: SuperApp certification nightly
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 180
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true

      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Build Packages
        run: pnpm run prepare-build

      - name: Install Puppeteer
        run: cd ./tests/node_modules/puppeteer && npm run postinstall && cd ../..

      - name: Install Playwright browsers
        run: pnpm --dir tests/integration/rstest/basic-app-rstest-browser exec playwright install --with-deps chromium firefox webkit

      - name: Run SuperApp certification nightly
        run: pnpm run validate:superapp-certification:nightly

      - name: Generate Readiness Report
        if: always()
        run: |
          node scripts/superapp-certification/generate-readiness-report.js \
            --input-dir .modern/superapp-certification \
            --out-dir .modern/superapp-certification

      - name: Upload certification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: superapp-certification-nightly-${{ github.run_id }}
          path: .modern/superapp-certification/
          if-no-files-found: warn

  nightly-signal:
    name: Aggregate nightly signal
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 5
    if: always()
    needs:
      - script-tests
      - superapp-certification-nightly
    steps:
      - name: Report signal job results
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS_RESULTS"

      - name: Fail if any signal job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo 'At least one nightly signal job failed, was cancelled, or was skipped.'
          exit 1
