name: Release Contract Gates

on:
  pull_request:
    paths:
      - 'docs/super-app-rfc-adr/evidence/release-candidate/**'
      - 'docs/super-app-rfc-adr/PUBLISH-SECURITY-RUNBOOK.md'
      - 'packages/document/docs/**/guides/get-started/ultramodern.mdx'
      - 'packages/document/main-doc/docs/**/guides/get-started/ultramodern.mdx'
      - 'packages/document/docs/**/components/init-app.mdx'
      - 'packages/document/docs/**/configure/app/bff/runtime-framework.mdx'
      - 'packages/toolkit/create/README.md'
      - 'packages/toolkit/create/template/README.md'
      - 'packages/toolkit/create/template/package.json.handlebars'
      - 'packages/toolkit/create/template/pnpm-workspace.yaml'
      - 'packages/toolkit/create/template/.github/renovate.json'
      - 'packages/toolkit/create/template/.github/workflows/ultramodern-gates.yml.handlebars'
      - 'packages/toolkit/create/template/rstest.config.mts'
      - 'packages/toolkit/create/template/scripts/**'
      - 'packages/toolkit/create/template/src/routes/[lang]/page.tsx.handlebars'
      - 'packages/toolkit/create/template/tests/**'
      - 'packages/toolkit/create/template-workspace/**'
      - 'packages/toolkit/sandpack-react/src/templates/mwa.ts'
      - 'scripts/release-gates/**'
      - 'scripts/security/**'
      - 'scripts/ultramodern-publish/**'
      - '.github/renovate.json'
      - '.github/workflows/publish-bleedingdev.yml'
      - '.github/workflows/release-contract-gates.yml'
      - '.github/workflows/workflow-security.yml'
  workflow_dispatch:
    inputs:
      evidence_dir:
        description: 'Evidence directory containing architecture/validation/test/review gate docs'
        required: true
        default: 'docs/super-app-rfc-adr/evidence/release-candidate/current'
      run_commands:
        type: choice
        description: 'Execute representative gate test commands'
        required: true
        default: 'true'
        options:
          - 'true'
          - 'false'
      allow_missing_evidence:
        type: choice
        description: 'Allow missing evidence files (for dry-run validation only)'
        required: true
        default: 'false'
        options:
          - 'true'
          - 'false'

  workflow_call:
    inputs:
      evidence_dir:
        description: 'Evidence directory containing architecture/validation/test/review gate docs'
        required: true
        type: string
      run_commands:
        description: 'Execute representative gate test commands'
        required: false
        default: 'true'
        type: string
      allow_missing_evidence:
        description: 'Allow missing evidence files (for dry-run validation only)'
        required: false
        default: 'false'
        type: string

jobs:
  release-contract-gates:
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Release Candidate Contract Gates
        env:
          EVIDENCE_DIR: ${{ inputs.evidence_dir || github.event.inputs.evidence_dir || 'docs/super-app-rfc-adr/evidence/release-candidate/current' }}
          RUN_COMMANDS_INPUT: ${{ inputs.run_commands || github.event.inputs.run_commands || '' }}
          ALLOW_MISSING_EVIDENCE: ${{ inputs.allow_missing_evidence || github.event.inputs.allow_missing_evidence || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          RUN_COMMANDS="$RUN_COMMANDS_INPUT"
          if [ -z "$RUN_COMMANDS" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              RUN_COMMANDS="false"
            else
              RUN_COMMANDS="true"
            fi
          fi

          ARGS=(
            --profile scripts/release-gates/rc-contract-profile.json
            --evidence-dir "$EVIDENCE_DIR"
          )

          if [ "$ALLOW_MISSING_EVIDENCE" = "true" ]; then
            ARGS+=(--allow-missing-evidence)
          fi

          if [ "$RUN_COMMANDS" = "false" ]; then
            ARGS+=(--skip-commands)
          fi

          node scripts/release-gates/validate-release-candidate-gates.js "${ARGS[@]}"

      - name: Validate gate snapshot artifact shape
        run: |
          node scripts/release-gates/validate-gate-snapshot.js \
            --snapshot-path .modern/contract-gates.json \
            --required-gate release-candidate-contract-gates
