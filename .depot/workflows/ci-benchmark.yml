name: CI Benchmark (project-cache cold)

# Manual measurements only. Dispatch the same immutable commit on both providers.
# GitHub must register this file on the default branch before it can be dispatched.
on:
  workflow_dispatch:

permissions:
  contents: read

# A distinct group preserves every sample, including pending runs.
concurrency:
  group: ci-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_SKIP_NX_CACHE: 'true'
  NX_SKIP_REMOTE_CACHE: 'true'
  NX_NO_CLOUD: 'true'

jobs:
  benchmark:
    name: ci-benchmark (${{ matrix.workload }})
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workload: [type-check, unit-build-consumers]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize isolated project caches
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          benchmark_root="$(mktemp -d "$RUNNER_TEMP/ci-benchmark.XXXXXXXX")"
          {
            echo "CI_BENCHMARK_TEMP=$benchmark_root"
            echo "MISE_DATA_DIR=$benchmark_root/mise"
            echo "MISE_CACHE_DIR=$benchmark_root/mise-cache"
            echo "npm_config_cache=$benchmark_root/npm-cache"
            echo "PLAYWRIGHT_BROWSERS_PATH=$benchmark_root/playwright"
            echo "NX_CACHE_DIRECTORY=$benchmark_root/nx-cache"
            echo "NX_WORKSPACE_DATA_DIRECTORY=$benchmark_root/nx-workspace-data"
          } >> "$GITHUB_ENV"
          echo 'CI_BENCHMARK_CACHE_EVIDENCE {"schemaVersion":1,"cacheState":"cold","actionsCache":false,"miseCache":false,"pnpmStore":"fresh-per-job","browsers":"fresh-per-job","preparedBuildRestore":false,"nxTaskCache":false,"nxRemoteCache":false}'

      # Match the existing type-check setup; unit tests use mise directly.
      - name: Setup Node.js 26.10.0
        if: matrix.workload == 'type-check'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          mise_dir: ${{ env.MISE_DATA_DIR }}
          cache: false
          cache_save: false
          install: true

      - name: Verify pinned test toolchain
        run: |
          pnpm_version="$(pnpm --version)"
          node scripts/ci/check-test-toolchain.mjs "$pnpm_version"

      - name: Record CI benchmark evidence
        run: |
          pnpm_version="$(pnpm --version)"
          node scripts/ci/record-runner-evidence.mjs "$pnpm_version"

      # No cache restore/save actions. This store starts empty outside the checkout.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --store-dir "$CI_BENCHMARK_TEMP/pnpm-store"

      - name: Type Check
        if: matrix.workload == 'type-check'
        run: mise exec -- pnpm run prepare-build

      - name: Build cross-project type-check dependency
        if: matrix.workload == 'type-check'
        run: mise exec -- pnpm --dir tests/integration/bff-cross-project/bff-api-app build

      - name: Validate critical packages with native TypeScript
        if: matrix.workload == 'type-check'
        run: mise exec -- pnpm run validate:typescript

      # Build locally on every unit sample; do not restore prepared outputs.
      - name: Build Required Pkg
        if: matrix.workload == 'unit-build-consumers'
        run: pnpm run build:required

      - name: Test release browser contracts
        if: matrix.workload == 'unit-build-consumers'
        run: node --test scripts/ultramodern-production-readiness/__tests__/built-framework/*.test.js

      - name: Resolve Playwright runtime
        if: matrix.workload == 'unit-build-consumers'
        id: browser-runtime
        run: node scripts/lib/browser-provisioning.js --resolve --runtime tests/integration/rstest/basic-app-rstest-browser --runtime tests/integration/ultramodern-sandpack-profile-smoke

      - name: Install Playwright browsers
        if: matrix.workload == 'unit-build-consumers'
        run: >-
          node scripts/lib/browser-provisioning.js --install --runtime tests/integration/rstest/basic-app-rstest-browser --runtime tests/integration/ultramodern-sandpack-profile-smoke
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Test
        if: matrix.workload == 'unit-build-consumers'
        run: pnpm run test:ut:prepared

      - name: Test build consumers
        if: matrix.workload == 'unit-build-consumers'
        run: pnpm run test:build-consumers

      # The runner also tears down the checkout and its build outputs at job end.
      - name: Remove owned benchmark caches
        if: always()
        run: |
          if [ -z "${CI_BENCHMARK_TEMP:-}" ]; then
            exit 0
          fi
          case "$CI_BENCHMARK_TEMP" in
            "$RUNNER_TEMP"/ci-benchmark.????????)
              rm -rf -- "$CI_BENCHMARK_TEMP"
              ;;
            *)
              echo "Refusing to remove an unexpected benchmark directory" >&2
              exit 1
              ;;
          esac
