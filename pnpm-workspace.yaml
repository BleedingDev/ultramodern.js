packages:
  - 'packages/*'
  - 'packages/cli/*'
  - 'packages/document/*'
  - 'packages/runtime/*'
  - 'packages/generator/*'
  - 'packages/generator/generators/*'
  - 'packages/generator/plugins/*'
  - 'packages/review/*'
  - 'packages/server/*'
  - 'packages/module/*'
  - 'packages/solutions/*'
  - 'packages/toolkit/*'
  - 'packages/toolkit/compiler/*'
  - 'scripts/*'
  - 'tests'
  - 'tests/integration/**/*'
  - 'tests/e2e/**/*'
  - 'website/*'
  - 'benchmark/*'
  - 'examples/*'
  - 'examples/deploy/*'
  - 'examples/module-federation/*/*'
  # FORK: gitignored build output under tests/integration/** contains emitted
  # package.json files (e.g. routes-tanstack-mf/mf-remote/dist/shared/effect and
  # bff-cross-project/bff-api-app/dist-1/client)
  # that match the globs above, so a local `pnpm install` on a dirty tree adds
  # phantom importers to pnpm-lock.yaml. Upstream has no such emitted manifests.
  - '!tests/integration/**/dist/**'
  - '!tests/integration/**/dist-*/**'
  - '!tests/integration/**/node_modules/**'

autoInstallPeers: false
linkWorkspacePackages: false
strictPeerDependencies: false
# Installs are explicit serialized stages; test/build commands must not relink
# the shared dependency graph as a side effect.
verifyDepsBeforeRun: error

allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': true
  '@swc/core': true
  bufferutil: true
  core-js: true
  # Browser binaries are installed explicitly by examples/test-cypress.
  cypress: false
  es5-ext: true
  esbuild: true
  msgpackr-extract: true
  nx: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true

patchedDependencies:
  # Lazy-load Module Federation DTS helpers so apps with `dts: false` do not
  # import the DTS plugin in the TS 7 native-preview lane.
  '@module-federation/modern-js-v3@2.9.0': patches/@module-federation__modern-js-v3@2.9.0.patch
  '@module-federation/dts-plugin@2.9.0': patches/@module-federation__dts-plugin@2.9.0.patch
  '@module-federation/manifest@2.9.0': patches/@module-federation__manifest@2.9.0.patch
  '@module-federation/rspack@2.9.0': patches/@module-federation__rspack@2.9.0.patch
  # Repair the runtime-core remote declaration's missing ResourceLoadContext
  # import so strict library checking can consume its public hook types.
  '@module-federation/runtime-core@2.9.0': patches/@module-federation__runtime-core@2.9.0.patch
  # Repair bridge-react's declaration specifiers for portable TS resolution.
  '@module-federation/bridge-react@2.9.0': patches/@module-federation__bridge-react@2.9.0.patch
  # Remove msgpackr's dynamic Function optimization from browser/edge ESM.
  # Its ordinary decoder is functionally equivalent and CSP/Worker-safe.
  'msgpackr@2.1.0': patches/msgpackr@2.1.0.patch
  # Disable Zod's Function-constructor capability probe in CSP/Worker bundles.
  'zod@4.5.4': patches/zod@4.5.4.patch
  # Keep source-workspace installs hardened before the independently published
  # image sidecars exist; release staging redirects the shipped image package.
  'image-size@2.0.2': patches/image-size@2.0.2.patch
overrides:
  micromatch: ^4.0.8
  # Effect resolves msgpackr through a caret; pin it to the patched release.
  msgpackr: 2.1.0
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  '@remix-run/router': '>=1.23.3'
  # Preserve each consumer's declared router major while closing the affected
  # ranges. The Module Federation bridge still requires the v7 layout.
  'react-router@>=7.0.0 <7.18.2': 7.18.2
  'react-router@>=8.0.0 <8.3.1': 8.3.1
  '@modern-js/runtime-utils>react-router': 7.18.2
  'dev-server>react-router': 8.3.1
  h3: '>=1.15.11'
  tar: '>=7.5.22'
  diff: '>=9.0.0'
  debug: '>=4.4.3'
  cross-spawn: '>=7.0.6'
  lodash-es: '>=4.18.1'
  esbuild: '>=0.28.1'
  tmp: '>=0.2.7'
  '@isaacs/brace-expansion': '>=5.0.1'
  'minimatch@3>brace-expansion': 1.1.18
  'minimatch@9>brace-expansion': 2.1.4
  'brace-expansion@': 5.0.9
  yaml: '>=2.9.0'
  qs: '>=6.16.0'
  smol-toml: '>=1.7.1'
  dompurify: '>=3.4.13'
  serialize-javascript: '>=7.0.6'
  ws: '>=8.21.0'
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'uuid@>=13.0.0 <13.0.1': 14.0.1
  follow-redirects: '>=1.16.0'
  defu: '>=6.1.7'
  handlebars: '>=4.7.9'
  node-forge: '>=1.4.0'
  'picomatch@<3': 2.3.2
  'picomatch@>=4.0.0 <4.0.4': 4.0.4
  'socket.io@4.8.1>socket.io-parser': 4.2.7
  'svgo@>=3.0.0 <3.3.5': 3.3.5
  'svgo@>=4.0.0 <4.1.0': 4.1.0

peerDependencyRules:
  ignoreMissing:
    - ioredis
    - webpack
  allowedVersions:
    '@module-federation/sdk>node-fetch': 3.3.0
    'fdir@6.5.0>picomatch': 4.0.5
    'react-side-effect@2.1.2>react': '19'

allowedDeprecatedVersions:
  '@babel/plugin-proposal-object-rest-spread': 7.12.1 || 7.20.7
  '@babel/plugin-proposal-private-property-in-object': 7.21.0
  '@financial-times/polyfill-useragent-normaliser': 1.10.2
  formidable: 1.2.6
  sourcemap-codec: 1.4.8
  js-polyfills: 0.1.43
  picturefill: 3.0.3
  querystring: 0.2.0
  string-similarity: 4.0.4
  source-map-resolve: 0.6.0 || 0.5.3
  '@formatjs/intl-utils': 3.8.4
  debug: 4.1.1
  uuid: 3.4.0
  trim: 0.0.1

minimumReleaseAgeExclude:
  - '@typescript/native-preview'
  - '@typescript/native-preview-*'
